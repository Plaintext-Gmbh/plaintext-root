# archRule.failOnEmptyShould=false STAND HIER BIS ZUM 22.09.2026 (Karte 1294, aus 1274/Befund 4).
#
# Der Schalter machte jede ArchUnit-Regel gruen, deren that()-Filter nichts trifft — also genau
# dann, wenn die Regel nichts mehr prueft. Er stand in vier von sechs Repos (root, schuetu, iot,
# fwtool) und in app und guild NICHT; dieselben geteilten Regeln waren dort strenger.
#
# Die Begruendung, die hier stand, lautete: "fwtool hat keine periodischen Laeufe, schuetu keine
# PlaintextCron-Impls usw." Sie traegt nicht. Gemessen am 22.09.2026 in plaintext-fwtool — dem
# Repo, das die Begruendung namentlich nennt und das mit 0 eigenen @Scheduled-Dateien und
# 0 eigenen PlaintextCron-Implementierungen der schwaechste Fall von allen vieren ist:
#
#   Lauf 1  Schalter wie bisher (=false), zusaetzlich eine absichtlich leere Probe-Regel
#           -> BUILD SUCCESS, 6 Tests gruen.  Die leere Regel ist gruen.
#   Lauf 2  Schalter entfernt (ArchUnit-Default true), dieselbe Probe-Regel
#           -> BUILD FAILURE, genau 1 Fehlschlag: die Probe-Regel.  ArchUnit meldet
#              "failed to check any classes".  DAS ist die Positivkontrolle: ohne sie belegte
#              Lauf 3 nur, dass nichts kaputtging.
#   Lauf 3  Schalter entfernt, ohne Probe-Regel
#           -> BUILD SUCCESS, 5 Tests gruen.  KEINE der echten Regeln ist leer.
#
# Warum keine leer ist: @AnalyzeClasses(packages = "ch.plaintext") analysiert den ganzen
# Klassenpfad, nicht nur das eigene Modul — und darin liegen die root-Framework-Jars mit
# 4 @Scheduled-Dateien und 5 PlaintextCron-Implementierungen. "fwtool hat keine periodischen
# Laeufe" stimmt fuer fwtools eigenen Quelltext und ist fuer die Regel trotzdem unerheblich.
#
# WICHTIG, falls jemand den Schalter je wieder braucht: der Key ist camelCase (archRule), nicht
# archrule — und ein `mvn clean` gehoert dazu. Diese Datei liegt nach dem Bau auch in
# target/test-classes; wird sie nur unter src/ entfernt, wirkt die alte Fassung von dort weiter
# (in der Messung oben zuerst passiert: Lauf 2 war faelschlich gruen).
#
# ArchUnit kann die Ausnahme je Regel setzen: ArchRule.allowEmptyShould(true). Das ist der Weg
# fuer eine einzelne, begruendet leere Regel — nicht dieser globale Schalter, der auf alle wirkt.
archRule.failOnEmptyShould=true
