# Card 546 — scope contract for this application's MCP tools.
# Evaluated by ch.plaintext.arch.PlaintextMcpScopeVertragTest (plaintext-root-archtests).
#
# mindestens.werkzeuge  Lower bound for the @McpTool methods found on the classpath. It is here
#                       because a contract test of the form "every tool found is in order" stays
#                       green even when none are found at all. Measured on a proxied bean in guild:
#                       the proxy-aware lookup found 9 tools, the naive one 0 — silently. A value
#                       set too low looks like progress.
#
# ausnahme.<class>#<method>  Places WITHOUT @PreAuthorize that are protected all the same. Each one
#                       needs a justification; an exception without a reason is a hole with a lid
#                       on it. The test also reports entries that no longer cover any finding
#                       (fossilisation).

mindestens.werkzeuge = 9

# As of 28 August 2026: 4 (apitoken 3, secrets 1) + 3 (BenutzerMcpTools: list_benutzer,
# export_benutzer, import_benutzer). The three new ones carry @PreAuthorize("hasAuthority('SCOPE_ADMIN')")
# AND check the role in the method body on top — they therefore need no exception entry: the
# annotation is present and the body check comes in addition. That way round is the right one,
# because an exception withdraws the spot from the automated check, and that is only justifiable
# where an annotation cannot do the job.

# --- The four root tools check in the method body, and do so MORE STRICTLY than an annotation ------
#
# All four require SCOPE_ADMIN *and* the role ADMIN or ROOT (ApiTokenMcpTools#aufruferPruefen and
# SecretsMcpTools#autorisierungPruefen respectively). The role is needed because, according to
# ApiTokenMenu, issuing a token in the user interface is open to the roles USER, ADMIN and ROOT and
# the scope is freely selectable there — otherwise an ordinary member could issue an ADMIN token to
# themselves and bypass the check that way.
#
# Anyone who "fixes these four violations" by switching them to @PreAuthorize LOSES the role check.
# They are therefore deliberately left as they are and listed here.

ausnahme.ch.plaintext.apitoken.ApiTokenMcpTools#createApiToken = \
    Rumpfpruefung, strenger als eine Annotation: SCOPE_ADMIN UND Rolle ADMIN/ROOT (aufruferPruefen)
ausnahme.ch.plaintext.apitoken.ApiTokenMcpTools#listApiTokens = \
    Rumpfpruefung, strenger als eine Annotation: SCOPE_ADMIN UND Rolle ADMIN/ROOT (aufruferPruefen)
ausnahme.ch.plaintext.apitoken.ApiTokenMcpTools#revokeApiToken = \
    Rumpfpruefung, strenger als eine Annotation: SCOPE_ADMIN UND Rolle ADMIN/ROOT (aufruferPruefen)
ausnahme.ch.plaintext.secrets.mcp.SecretsMcpTools#setSecret = \
    Rumpfpruefung, strenger als eine Annotation: SCOPE_ADMIN UND Rolle ADMIN/ROOT \
    (autorisierungPruefen, Karte 557). Die Klasse begruendet zusaetzlich, warum der Rumpf und nicht \
    die Annotation: ein MCP-Aufruf laeuft nicht ueber den Web-Pfad, und eine still wirkungslose \
    Annotation saehe von aussen wie eine wirksame aus.

# Karte 999 (30.08.2026): dieselbe Rumpfpruefung, dieselbe Begruendung. Das aktive Secrets-Backend
# liess sich bis dahin nur ueber die JSF-Oberflaeche setzen — bei Karte 996 musste die
# Konfigurationszeile deshalb per SQL geschrieben und das Kryptoformat nachgebaut werden. Wer diese
# beiden auf @PreAuthorize umstellt, verliert die Rollenpruefung: Ein gewoehnliches Mitglied kann
# sich in der Oberflaeche selbst ein Token mit Scope ADMIN ausstellen.
ausnahme.ch.plaintext.secrets.mcp.SecretsMcpTools#setSecretBackend = \
    Rumpfpruefung, strenger als eine Annotation: SCOPE_ADMIN UND Rolle ADMIN/ROOT \
    (autorisierungPruefen, Karte 999). Wer das Backend umstellt, lenkt kuenftige Secrets auf einen \
    Tresor seiner Wahl — dasselbe Gewicht wie das Schreiben eines Secrets.
ausnahme.ch.plaintext.secrets.mcp.SecretsMcpTools#secretBackendStatus = \
    Rumpfpruefung, strenger als eine Annotation: SCOPE_ADMIN UND Rolle ADMIN/ROOT \
    (autorisierungPruefen, Karte 999). Nur lesend, aber die Antwort nennt Backend, Mount und URL — \
    Aufklaerung, die ein READ-Token nicht bekommen soll.
