# Karte 546 — Scope-Vertrag der MCP-Werkzeuge dieser Anwendung.
# Ausgewertet von ch.plaintext.arch.PlaintextMcpScopeVertragTest (plaintext-root-archtests).
#
# mindestens.werkzeuge  Untergrenze der am Klassenpfad gefundenen @McpTool-Methoden. Sie steht hier,
#                       weil ein Vertragstest der Form "alle gefundenen Werkzeuge sind in Ordnung"
#                       auch dann gruen ist, wenn gar keine mehr gefunden werden. Gemessen an einem
#                       proxied Bean in guild: der proxy-bewusste Weg fand 9 Werkzeuge, der naive 0 —
#                       lautlos. Ein zu niedriger Wert sieht aus wie Fortschritt.
#
# ausnahme.<Klasse>#<methode>  Stellen OHNE @PreAuthorize, die trotzdem geschuetzt sind. Jede braucht
#                       eine Begruendung; eine Ausnahme ohne Grund ist ein Loch mit Deckel. Der Test
#                       meldet ausserdem Eintraege, die keinen Fund mehr abdecken (Versteinerung).

mindestens.werkzeuge = 9

# Stand 28.08.2026: 4 (apitoken 3, secrets 1) + 3 (BenutzerMcpTools: list_benutzer, export_benutzer,
# import_benutzer). Die drei neuen tragen @PreAuthorize("hasAuthority('SCOPE_ADMIN')") UND pruefen die
# Rolle zusaetzlich im Rumpf — sie brauchen deshalb keinen Ausnahmeeintrag: Die Annotation ist da, die
# Rumpfpruefung kommt oben drauf. Genau so herum ist es richtig, denn eine Ausnahme entzieht die
# Stelle der maschinellen Pruefung, und das ist nur zu rechtfertigen, wo eine Annotation nicht geht.

# --- Die vier root-Werkzeuge pruefen im Methodenrumpf, und zwar STRENGER als eine Annotation -------
#
# Alle vier verlangen SCOPE_ADMIN *und* die Rolle ADMIN oder ROOT (ApiTokenMcpTools#aufruferPruefen
# bzw. SecretsMcpTools#autorisierungPruefen). Die Rolle ist noetig, weil die Token-Ausstellung in der
# Oberflaeche laut ApiTokenMenu den Rollen USER, ADMIN und ROOT offensteht und der Scope dort frei
# waehlbar ist — ein gewoehnliches Mitglied koennte sich sonst selbst ein ADMIN-Token ausstellen und
# die Pruefung damit umgehen.
#
# Wer diese vier "Verstoesse behebt", indem er sie auf @PreAuthorize umstellt, VERLIERT die
# Rollenpruefung. Sie bleiben deshalb bewusst so und stehen hier.

ausnahme.ch.plaintext.apitoken.ApiTokenMcpTools#createApiToken = \
    Rumpfpruefung, strenger als eine Annotation: SCOPE_ADMIN UND Rolle ADMIN/ROOT (aufruferPruefen)
ausnahme.ch.plaintext.apitoken.ApiTokenMcpTools#listApiTokens = \
    Rumpfpruefung, strenger als eine Annotation: SCOPE_ADMIN UND Rolle ADMIN/ROOT (aufruferPruefen)
ausnahme.ch.plaintext.apitoken.ApiTokenMcpTools#revokeApiToken = \
    Rumpfpruefung, strenger als eine Annotation: SCOPE_ADMIN UND Rolle ADMIN/ROOT (aufruferPruefen)
ausnahme.ch.plaintext.secrets.mcp.SecretsMcpTools#setSecret = \
    Rumpfpruefung, strenger als eine Annotation: SCOPE_ADMIN UND Rolle ADMIN/ROOT \
    (autorisierungPruefen, Karte 557). Die Klasse begruendet zusaetzlich, warum der Rumpf und nicht \
    die Annotation: ein MCP-Aufruf laeuft nicht ueber den Web-Pfad, und eine still wirkungslose \
    Annotation saehe von aussen wie eine wirksame aus.

# Karte 999 (30.08.2026): dieselbe Rumpfpruefung, dieselbe Begruendung. Das aktive Secrets-Backend
# liess sich bis dahin nur ueber die JSF-Oberflaeche setzen — bei Karte 996 musste die
# Konfigurationszeile deshalb per SQL geschrieben und das Kryptoformat nachgebaut werden. Wer diese
# beiden auf @PreAuthorize umstellt, verliert die Rollenpruefung: Ein gewoehnliches Mitglied kann
# sich in der Oberflaeche selbst ein Token mit Scope ADMIN ausstellen.
ausnahme.ch.plaintext.secrets.mcp.SecretsMcpTools#setSecretBackend = \
    Rumpfpruefung, strenger als eine Annotation: SCOPE_ADMIN UND Rolle ADMIN/ROOT \
    (autorisierungPruefen, Karte 999). Wer das Backend umstellt, lenkt kuenftige Secrets auf einen \
    Tresor seiner Wahl — dasselbe Gewicht wie das Schreiben eines Secrets.
ausnahme.ch.plaintext.secrets.mcp.SecretsMcpTools#secretBackendStatus = \
    Rumpfpruefung, strenger als eine Annotation: SCOPE_ADMIN UND Rolle ADMIN/ROOT \
    (autorisierungPruefen, Karte 999). Nur lesend, aber die Antwort nennt Backend, Mount und URL — \
    Aufklaerung, die ein READ-Token nicht bekommen soll.
