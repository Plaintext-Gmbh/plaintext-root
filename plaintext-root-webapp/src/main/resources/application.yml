spring:
  application:
    name: plaintext-root
  profiles:
    active: dev
  config:
    import: "optional:file:./plconfig/spring/application.yml"
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 10MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:plaintext_root}
    username: ${DB_USER:plaintext}
    password: ${DB_PASSWORD:plaintext}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
      file: ../compose.yaml
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    # PR D: plaintext-root-email entfernt -> dessen bereits angewandte Migrationen (820503557/1777931115)
    # sind auf bestehenden DBs nicht mehr auflösbar; Validierung darf daran nicht scheitern (analog plaintext-app).
    validate-on-migrate: false

logging:
  level:
    root: WARN
    ch.plaintext: DEBUG
    org.springframework.security: DEBUG

server:
  forward-headers-strategy: FRAMEWORK
  servlet:
    session:
      # SECURITY (Karte 612): Sitzungen werden AUSSCHLIESSLICH ueber das Cookie gefuehrt.
      # Ohne diese Zeile haengt der Container die Kennung an die URL, sobald ein Client keine
      # Cookies mitschickt -- gemessen am 07.08.2026 erzeugte der Server sie selbst in jeder
      # Weiterleitung (Location: /login.html;jsessionid=...). Solche URLs landen in Lesezeichen,
      # im Referer und in Fehlermeldungen; eine davon ist als Zugang ohne Passwort und ohne
      # zweiten Faktor in eine Aufgabenkarte gelangt. Der pathParameterFilter faengt die
      # Altlasten, diese Zeile stoppt den Nachschub.
      tracking-modes: cookie
      # SECURITY (Karte 314, Punkt 1): Session-Lebensdauer explizit statt implizitem
      # Servlet-Default (30 min). Wert unveraendert 30 min -> kein Verhaltensbruch, aber
      # jetzt sichtbar und pro Umgebung ueberschreibbar.
      timeout: ${PLAINTEXT_SESSION_TIMEOUT:30m}
      cookie:
        # same-site bleibt bewusst 'lax' und wird NICHT auf 'strict' gezogen: der
        # OIDC-Ruecklaeufer (Keycloak -> /login/oauth2/code/*) ist eine cross-site
        # Top-Level-Navigation. Unter 'strict' schickt der Browser JSESSIONID dabei nicht
        # mit, die in der Session hinterlegte OAuth2-'state' waere weg und jeder
        # SSO-Login schluege fehl. 'lax' deckt den relevanten CSRF-Fall (cross-site POST)
        # bereits ab; POSTs sind zusaetzlich CSRF-token-geschuetzt.
        same-site: lax
        http-only: true
        # SECURITY (Karte 314, Punkt 1): Cookie nur ueber TLS. Default an; das dev-Profil
        # unten schaltet es ab, damit der lokale http://localhost-Start weiter funktioniert.
        secure: ${PLAINTEXT_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        # /actuator/health is permit-all (see PlaintextSecurityConfig);
        # the rest is gated behind ROLE_ADMIN. Prometheus metrics live
        # at /actuator/prometheus.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}

joinfaces:
  faces-servlet:
    url-mappings:
      - "*.jsf"
      - "*.xhtml"
      - "*.html"
      - "/faces/*"
  faces:
    number-of-views-in-session: 100
  primefaces:
    theme: none

# Secure by default: Swagger-UI und OpenAPI-Docs sind aus (verhindert API-Surface-/
# Versions-Disclosure in PROD). Fuer DEV per Env SPRINGDOC_ENABLED=true einschaltbar.
springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  show-actuator: false
  default-produces-media-type: application/json

plaintext:
  version: '@project.version@'
  stage: ${PLAINTEXT_ENV:dev}
  root:
    version: '@project.version@'
  menu:
    scan-package: ch.plaintext
  security:
    # Signing key for the persistent remember-me cookie. Leave blank in dev
    # (an ephemeral key is generated + WARN-logged). MUST be a stable secret in
    # prod (env PLAINTEXT_SECURITY_REMEMBER_ME_KEY), otherwise all remember-me
    # cookies invalidate on restart.
    remember-me-key: ${PLAINTEXT_SECURITY_REMEMBER_ME_KEY:}
    # Issue a persistent remember-me cookie on OAuth2/OIDC login too (default true).
    # Form login already gets remember-me from the Spring filter; the oauth2Login
    # flow does not, so an iPhone home-screen shortcut re-ran the full
    # OAuth -> Keycloak -> GitHub flow on every visit. When true, the success
    # handler issues the cookie for OAuth logins and the remember-me service runs
    # with alwaysRemember=true (side effect: form login then ALWAYS gets a cookie
    # too — intended for this personal-admin use case). Set false for the legacy
    # opt-in behaviour.
    remember-me-on-oauth: ${PLAINTEXT_SECURITY_REMEMBER_ME_ON_OAUTH:true}
    # SECURITY (Karte 314, Punkt 13): Gueltigkeit des persistenten Remember-Me-Cookies.
    # Vorher hart 14 Tage im Code. Default jetzt 7 Tage und konfigurierbar; in Verbindung
    # mit remember-me-on-oauth=true bekommt JEDER Login einen Cookie, deshalb ist die
    # kuerzere Standardgueltigkeit die risikoaermere Voreinstellung.
    remember-me-validity: ${PLAINTEXT_SECURITY_REMEMBER_ME_VALIDITY:7d}
    page-guard:
      # SECURITY (Karte 308): Seiten-Zugriffsschutz fail-closed fuer DIESE App.
      # Der Framework-Default in PlaintextSecurityProperties ist bewusst REPORT: jede
      # konsumierende App (plaintext-app/-guild/-schuetu/-iot/-fwtool) bringt ihre eigene
      # application.yml mit, die diese hier auf dem Klassenpfad verdeckt — sie bleibt also bei
      # REPORT, bis ihre Views vollstaendig einem Menueeintrag/Alias zugeordnet sind. Die
      # root-App selbst ist vollstaendig zugeordnet (siehe MenuLinkInvariantTest) und laeuft
      # deshalb schon jetzt in STRICT: kein Menuetreffer -> verweigern, plus Vererbung der
      # Eltern-Rollen.
      mode: ${PLAINTEXT_SECURITY_PAGE_GUARD_MODE:STRICT}

---
# SECURITY (Karte 314, Punkt 1): dev laeuft ueber http://localhost — ein Secure-Cookie
# wuerde dort gar nicht erst gesetzt und der Login schlaege fehl. Nur hier abschalten,
# die Voreinstellung oben bleibt secure=true.
spring:
  config:
    activate:
      on-profile: dev
server:
  servlet:
    session:
      cookie:
        secure: false
