spring:
  application:
    name: plaintext-root
  profiles:
    active: dev
  config:
    import: "optional:file:./plconfig/spring/application.yml"
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 10MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:plaintext_root}
    username: ${DB_USER:plaintext}
    password: ${DB_PASSWORD:plaintext}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
      file: ../compose.yaml
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    # PR D: plaintext-root-email was removed -> its already applied migrations (820503557/1777931115)
    # can no longer be resolved on existing databases; validation must not fail over that (same as plaintext-app).
    validate-on-migrate: false

logging:
  level:
    root: WARN
    ch.plaintext: DEBUG
    org.springframework.security: DEBUG

server:
  forward-headers-strategy: FRAMEWORK
  servlet:
    session:
      # SECURITY (card 612): hardening — sessions are carried EXCLUSIVELY by the cookie;
      # without this line the container may append the session id to the URL.
      # Do not change without asking; background in
      # plaintext-config/docs/SECURITY_ENTSCHEIDE.md.
      # CAUTION (reach): this line takes effect ONLY in plaintext-root -- every application
      # brings its own application.yml, which shadows this one. What is effective for ALL
      # applications is the SessionTrackingConfig initializer in plaintext-root-web; this line
      # stays as documentation in the place where it is expected.
      tracking-modes: cookie
      # SECURITY (card 314, item 1): session lifetime stated explicitly instead of relying on
      # the implicit servlet default (30 min). The value is unchanged at 30 min -> no change in
      # behaviour, but it is now visible and overridable per environment.
      timeout: ${PLAINTEXT_SESSION_TIMEOUT:30m}
      cookie:
        # same-site deliberately stays 'lax' and is NOT tightened to 'strict': the OIDC
        # callback (Keycloak -> /login/oauth2/code/*) is a cross-site top-level navigation.
        # Under 'strict' the browser would not send JSESSIONID along with it, the OAuth2
        # 'state' held in the session would be gone and every SSO login would fail. 'lax'
        # already covers the relevant CSRF case (cross-site POST); POSTs are additionally
        # protected by a CSRF token.
        same-site: lax
        http-only: true
        # SECURITY (card 314, item 1): cookie over TLS only. On by default; the dev profile
        # below turns it off so that the local http://localhost start keeps working.
        secure: ${PLAINTEXT_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        # /actuator/health is permit-all (see PlaintextSecurityConfig);
        # the rest is gated behind ROLE_ADMIN. Prometheus metrics live
        # at /actuator/prometheus.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}

joinfaces:
  faces-servlet:
    url-mappings:
      - "*.jsf"
      - "*.xhtml"
      - "*.html"
      - "/faces/*"
  faces:
    number-of-views-in-session: 100
  primefaces:
    theme: none
    # Precondition for plaintext.security.csp.script-unsafe-inline=false (see there): with
    # csp=true PrimeFaces pulls its own on… handlers out of the markup and registers them via
    # PrimeFaces.csp; its own blocks are given a nonce. app, guild, iot and schuetu have set
    # this for a long time, the root application itself has not — deliberately NOT switched
    # over in this PR, because it changes runtime behaviour and has to be checked in a browser.
    # csp: true

# Secure by default: Swagger UI and the OpenAPI docs are off (prevents API surface and
# version disclosure in PROD). Can be switched on for DEV via the env var SPRINGDOC_ENABLED=true.
springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  show-actuator: false
  default-produces-media-type: application/json

plaintext:
  version: '@project.version@'
  stage: ${PLAINTEXT_ENV:dev}
  root:
    version: '@project.version@'
  menu:
    scan-package: ch.plaintext
  security:
    # Signing key for the persistent remember-me cookie. Leave blank in dev
    # (an ephemeral key is generated + WARN-logged). MUST be a stable secret in
    # prod (env PLAINTEXT_SECURITY_REMEMBER_ME_KEY), otherwise all remember-me
    # cookies invalidate on restart.
    remember-me-key: ${PLAINTEXT_SECURITY_REMEMBER_ME_KEY:}
    # Issue a persistent remember-me cookie on OAuth2/OIDC login too (default true).
    # Form login already gets remember-me from the Spring filter; the oauth2Login
    # flow does not, so an iPhone home-screen shortcut re-ran the full
    # OAuth -> Keycloak -> GitHub flow on every visit. When true, the success
    # handler issues the cookie for OAuth logins and the remember-me service runs
    # with alwaysRemember=true (side effect: form login then ALWAYS gets a cookie
    # too — intended for this personal-admin use case). Set false for the legacy
    # opt-in behaviour.
    remember-me-on-oauth: ${PLAINTEXT_SECURITY_REMEMBER_ME_ON_OAUTH:true}
    # SECURITY (card 314, item 13): validity of the persistent remember-me cookie.
    # Previously hard-coded to 14 days. The default is now 7 days and configurable; combined
    # with remember-me-on-oauth=true EVERY login gets a cookie, which is why the shorter
    # default validity is the lower-risk setting.
    remember-me-validity: ${PLAINTEXT_SECURITY_REMEMBER_ME_VALIDITY:7d}
    csp:
      # Wave 4: script-src carries 'unsafe-inline' until further notice (default true = status quo).
      # As long as that token is in there, the browser executes EVERY <script> in the document —
      # an injected one included; at this point the CSP therefore offers no protection.
      #
      # Switching it to false takes TWO things, and both have to be in place:
      #   1. joinfaces.primefaces.csp=true (the commented-out line above) — then PrimeFaces pulls its own handlers
      #      out of the markup and gives its blocks a nonce. The four applications (app, guild,
      #      iot, schuetu) have set this for a long time; root itself has not yet, and that is
      #      the open precondition for this app.
      #   2. no inline JavaScript of our own in the markup. PlaintextInlineJsVertragTest checks
      #      that (plaintext-root-archtests), armed for this reactor via
      #      plaintext.arch.inline-js=enforce in the surefire block of plaintext-root-webapp.
      # The switch is made app by app, so that a failure hits one app and not the whole family.
      script-unsafe-inline: ${PLAINTEXT_SECURITY_CSP_SCRIPT_UNSAFE_INLINE:true}
    page-guard:
      # SECURITY (card 308): hardening — page access guard fail-closed for THIS app: no menu
      # match -> deny, plus inheritance of the parent roles. This requires that every view is
      # mapped to a menu entry or an alias (see MenuLinkInvariantTest); the framework default
      # in PlaintextSecurityProperties is therefore the introductory mode REPORT.
      # Do not change without asking.
      mode: ${PLAINTEXT_SECURITY_PAGE_GUARD_MODE:STRICT}

---
# SECURITY (card 314, item 1): dev runs over http://localhost — a secure cookie would not
# even be set there and the login would fail. Switch it off here only; the default above
# stays secure=true.
spring:
  config:
    activate:
      on-profile: dev
server:
  servlet:
    session:
      cookie:
        secure: false
