<ui:composition xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml" template="/includes/template.xhtml">

    <f:metadata>
        <f:event type="preRenderView" listener="#{myUserBackingBean.checkAccess()}"/>
    </f:metadata>

    <ui:define name="content">
        <h:form id="fm">
            <input type="hidden" name="_csrf" value="#{_csrf.token}"/>

        <style>
            /* Defining column widths */
            .label-column {
                width: 30%;
            }

            .input-column {
                width: 70%;
            }

            /* Ensuring that columns sum to less than 100% to avoid overflow */
            .grid-example {
                width: 100%;
            }

            /* Add spacing between rows in dialog */
            .dialog-grid td {
                padding: 8px 4px;
            }

            /* Button group styles - responsive */
            .user-action-buttons {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 10px;
                margin-bottom: 10px;
                margin-left: 10px;
            }

            /*
             * SECURITY/UX (Forensik 23.08.2026): Die Auswahl-Menues im Dialog standen auf fixen 450 px bzw.
             * 360 px. Auf einem Telefon-Viewport (typisch 360-390 px) ragten Feld UND Overlay-Panel
             * ueber den Bildschirm hinaus — Kaestchen waren nur teilweise oder gar nicht treffbar.
             * Genau daraus entstand die leere Rollenauswahl, die einem Administratorkonto still
             * 'root' und 'admin' entzog. Die Breiten sind jetzt Obergrenzen statt Vorgaben.
             */
            .dialog-grid .ui-selectcheckboxmenu,
            .dialog-grid .ui-selectonemenu,
            .dialog-grid .ui-inputfield {
                max-width: 100%;
                box-sizing: border-box;
            }

            /* Das Overlay-Panel haengt am body, nicht am Dialog — deshalb separat begrenzen. */
            .ui-selectcheckboxmenu-panel {
                max-width: calc(100vw - 20px);
                box-sizing: border-box;
            }

            /* Mobile optimizations */
            @media screen and (max-width: 768px) {
                .user-action-buttons {
                    grid-template-columns: 1fr;
                    margin-left: 0;
                }

                .user-action-buttons .ui-button {
                    width: 100% !important;
                    margin-left: 0 !important;
                }

                /* Zwei-Spalten-Raster des Dialogs untereinander stapeln, damit die Eingabe-
                   felder die volle Breite bekommen statt in eine 70%-Spalte gequetscht zu werden. */
                .dialog-grid,
                .dialog-grid tbody,
                .dialog-grid tr,
                .dialog-grid td {
                    display: block;
                    width: 100%;
                }
            }
        </style>

        <p:growl id="messages" showDetail="true" life="3000"/>

        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
            <p:commandButton value="#{i18n.t('Ja')}" type="button" styleClass="ui-confirmdialog-yes"/>
            <p:commandButton value="#{i18n.t('Nein')}" type="button" styleClass="ui-confirmdialog-no"/>
        </p:confirmDialog>

        <p:fieldset id="fs1" legend="#{i18n.t('Benutzer Liste')}">

            <div class="user-action-buttons">
                <p:commandButton value="#{i18n.t('Neuer Benutzer')}"
                                 icon="pi pi-user-plus"
                                 actionListener="#{myUserBackingBean.newUser()}"
                                 oncomplete="PF('dlg').show()"
                                 update="fm"
                                 process="@this"/>

                <!--
                    Per user column selection (request from Daniel, 25 August 2026). Saving happens
                    on the change event, so on EVERY change in the opened menu - no
                    save button that can be forgotten. The "Bearbeiten" column is
                    deliberately not offered for selection: it is the only way to open a user.
                -->
                <p:selectCheckboxMenu id="spalten"
                                      value="#{myUserBackingBean.sichtbareSpalten}"
                                      label="#{i18n.t('Spalten')}"
                                      filter="true"
                                      filterMatchMode="contains"
                                      multiple="true"
                                      panelStyle="width: 16rem"
                                      style="margin-left: .5rem;">
                    <f:selectItems value="#{myUserBackingBean.spaltenAuswahl}"/>
                    <p:ajax event="change"
                            listener="#{myUserBackingBean.spaltenGeaendert()}"
                            update="fm:tbl"/>
                </p:selectCheckboxMenu>
            </div>

            <p:dataTable emptyMessage="-"
                         widgetVar="tbl"
                         multiViewState="true"
                         id="tbl"
                         selectionMode="single"
                         selection="#{myUserBackingBean.selected}"
                         reflow="true"
                         var="obj"
                         rowKey="#{obj.id}"
                         value="#{myUserBackingBean.users}"
                         filteredValue="#{myUserBackingBean.gefilterteUsers}"
                         rowIndexVar="ri">

                <p:ajax event="rowSelect" listener="#{myUserBackingBean.select()}" update="fm"/>
                <p:ajax event="rowUnselect" listener="#{myUserBackingBean.clearSelection()}" update="fm"/>

                <p:column headerText="ID" priority="5"
                          visible="#{myUserBackingBean.spalteSichtbar('id')}"
                          sortBy="#{obj.id}">
                    <h:outputText value=" #{obj.id}"/>
                </p:column>

                <p:column headerText="#{i18n.t('Benutzername')}" priority="1"
                          visible="#{myUserBackingBean.spalteSichtbar('username')}"
                          sortBy="#{obj.username}"
                          filterBy="#{obj.username}"
                          filterMatchMode="contains">
                    <h:outputText value=" #{obj.username}"/>
                </p:column>

                <p:column headerText="#{i18n.t('Vorname')}" priority="2"
                          visible="#{myUserBackingBean.spalteSichtbar('vorname')}"
                          sortBy="#{obj.vorname}"
                          filterBy="#{obj.vorname}"
                          filterMatchMode="contains">
                    <h:outputText value=" #{obj.vorname}"/>
                </p:column>

                <p:column headerText="#{i18n.t('Nachname')}" priority="2"
                          visible="#{myUserBackingBean.spalteSichtbar('nachname')}"
                          sortBy="#{obj.nachname}"
                          filterBy="#{obj.nachname}"
                          filterMatchMode="contains">
                    <h:outputText value=" #{obj.nachname}"/>
                </p:column>

                <!--
                    Multiple selection instead of free text: the tenant names are short and repeat
                    themselves, a list to tick off hits faster than typing. filter="true"
                    makes the list itself searchable as soon as there are many tenants.
                    filterMatchMode="in" is mandatory - with "contains" a multiple selection would
                    be compared against the value one item at a time and would match nothing.
                -->
                <p:column headerText="Mandat" priority="2"
                          visible="#{myUserBackingBean.spalteSichtbar('mandat')}"
                          sortBy="#{obj.mandat}"
                          filterBy="#{obj.mandat}"
                          filterMatchMode="in">
                    <f:facet name="filter">
                        <p:selectCheckboxMenu onchange="PF('tbl').filter()"
                                              styleClass="custom-filter"
                                              label="Mandat"
                                              filter="true"
                                              filterMatchMode="contains"
                                              multiple="true"
                                              panelStyle="width: 14rem">
                            <f:selectItems value="#{myUserBackingBean.mandatFilterAuswahl}"/>
                        </p:selectCheckboxMenu>
                    </f:facet>
                    <h:outputText value=" #{obj.mandat}"/>
                </p:column>

                <p:column headerText="#{i18n.t('Startseite')}" priority="3"
                          visible="#{myUserBackingBean.spalteSichtbar('startpage')}"
                          sortBy="#{obj.startpage}"
                          filterBy="#{obj.startpage}"
                          filterMatchMode="contains">
                    <h:outputText value=" #{obj.startpage}"/>
                </p:column>

                <p:column headerText="#{i18n.t('Bearbeiten')}" priority="1" style="width: 80px;">
                    <p:commandButton icon="pi pi-pencil"
                                     actionListener="#{myUserBackingBean.edit(obj)}"
                                     oncomplete="PF('dlg').show()"
                                     update="fm"
                                     process="@this"
                                     title="#{i18n.t('Bearbeiten')}"/>
                </p:column>

                <p:column headerText="Rem.Me" priority="4"
                          visible="#{myUserBackingBean.spalteSichtbar('remember')}">
                    <p:commandButton icon="pi pi-trash"
                                     styleClass="ui-button-danger"
                                     actionListener="#{myUserBackingBean.deleteRememberMeForUser(obj.username)}"
                                     update="fm:tbl"
                                     process="@this"
                                     disabled="#{!myUserBackingBean.hasRememberMeEntries(obj.username)}"
                                     title="Delete RememberMe"/>
                </p:column>

                <p:column headerText="Impersonate" priority="5" rendered="#{myUserBackingBean.root}"
                          visible="#{myUserBackingBean.spalteSichtbar('impersonate')}">
                    <p:commandButton icon="pi pi-user-edit"
                                     styleClass="ui-button-warning"
                                     actionListener="#{myUserBackingBean.impersonateUser(obj)}"
                                     update="@none"
                                     process="@this"
                                     disabled="#{obj.id == plaintextSecurity.id}"
                                     title="#{i18n.t('Als dieser Benutzer anmelden')}">
                        <p:confirm header="#{i18n.t('Bestätigung')}"
                                   message="#{i18n.t('Wollen Sie sich wirklich als dieser Benutzer anmelden?')}"
                                   icon="pi pi-exclamation-triangle"/>
                    </p:commandButton>
                </p:column>

            </p:dataTable>

            <p:dialog styleClass="mobile-safe" header="#{i18n.t('Benutzer Details')}" id="dlg" widgetVar="dlg" modal="true" showEffect="fade" hideEffect="fade" resizable="false" height="700">

                <h:panelGrid columns="2" styleClass="dialog-grid"
                             columnClasses="label-column, input-column">

                    <h:outputText value="ID:"/>
                    <h:outputText value="#{myUserBackingBean.selected.id}"/>

                    <h:outputText value="#{i18n.t('Benutzername')}:"/>
                    <p:inputText id="username" size="45" value="#{myUserBackingBean.selected.username}" required="true" requiredMessage="#{i18n.t('Benutzername ist erforderlich')}">
                        <f:validateRegex pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$"/>
                        <p:ajax event="blur" update="messages" listener="#{myUserBackingBean.validateUsername()}"/>
                    </p:inputText>

                    <!--
                        First and last name (request from Daniel, 25 August 2026). Both are optional:
                        existing accounts have no names, and a required field would block saving
                        every legacy account.
                    -->
                    <h:outputText value="#{i18n.t('Vorname')}:"/>
                    <p:inputText id="vorname" size="45" value="#{myUserBackingBean.selected.vorname}"/>

                    <h:outputText value="#{i18n.t('Nachname')}:"/>
                    <p:inputText id="nachname" size="45" value="#{myUserBackingBean.selected.nachname}"/>

                    <h:outputText value="#{i18n.t('Ohne Passwort (nur OIDC)')}:"/>
                    <h:panelGroup>
                        <!-- 29 August 2026 (Daniel): the checkbox updated the WHOLE dialog
                             (update="fm:dlg"). A dialog that re-renders itself via Ajax
                             loses its state and closes; it looked as if the
                             form were being saved immediately. Now only the two cells of the
                             password row are updated; the dialog stays open and the entries
                             remain. Absolute ids (leading colon), otherwise PrimeFaces searches
                             relative to the dialog and finds nothing. -->
                        <p:selectBooleanCheckbox id="passwordlessChk" value="#{myUserBackingBean.selected.passwordless}">
                            <p:ajax process="@this" update=":fm:pwLabelZelle :fm:pwFeldZelle"/>
                        </p:selectBooleanCheckbox>
                        <h:outputText value=" #{i18n.t('Login nur über OIDC möglich')}"
                                      style="font-size: 0.85rem; color: var(--text-color-secondary);"/>
                    </h:panelGroup>

                    <!-- Both cells ALWAYS stay in the grid (only their content depends on the checkbox);
                         otherwise a cell that drops out shifts all following rows of the
                         two-column panelGrid, as happened in setup.xhtml. -->
                    <h:panelGroup id="pwLabelZelle">
                        <h:outputText value="#{i18n.t('Passwort')}:"
                                      rendered="#{not myUserBackingBean.selected.passwordless}"/>
                    </h:panelGroup>
                    <h:panelGroup id="pwFeldZelle">
                      <h:panelGroup rendered="#{not myUserBackingBean.selected.passwordless}">
                        <p:password size="45" value="#{myUserBackingBean.selected.password}" required="#{(myUserBackingBean.myUserPw == null or myUserBackingBean.myUserPw == '') and not myUserBackingBean.selected.passwordless}" requiredMessage="#{i18n.t('Passwort ist bei einem neuen Benutzer erforderlich')}"/>
                        <h:outputText value="&#x2705; #{i18n.t('Passwort gesetzt')}"
                                      rendered="#{not empty myUserBackingBean.myUserPw and myUserBackingBean.myUserPw.startsWith('$2a$')}"
                                      style="display: block; margin-top: 4px; font-size: 0.85rem; color: var(--green-500);"/>
                        <h:outputText value="&#x1F513; #{i18n.t('Kein Passwort (OIDC-User)')}"
                                      rendered="#{empty myUserBackingBean.myUserPw or not myUserBackingBean.myUserPw.startsWith('$2a$')}"
                                      style="display: block; margin-top: 4px; font-size: 0.85rem; color: var(--orange-500);"/>
                      </h:panelGroup>
                    </h:panelGroup>

                    <h:outputText value="#{i18n.t('Rollen')}:"/>
                    <h:panelGroup>
                        <p:selectCheckboxMenu id="rolesMenu"
                                              value="#{myUserBackingBean.selectedRolesList}"
                                              label="#{i18n.t('Rollen wählen')}"
                                              multiple="true"
                                              filter="true" filterMatchMode="contains"
                                              panelStyle="width: 450px; max-width: calc(100vw - 20px);"
                                              style="width: 450px; max-width: 100%;">
                            <f:selectItems value="#{myUserBackingBean.selectableRoles}"
                                           var="r" itemLabel="#{r.label}" itemValue="#{r.name}"/>
                        </p:selectCheckboxMenu>
                        <small style="display: block; margin-top: 5px; color: #6c757d;">
                            #{i18n.t('Von den Modulen deklarierte Rollen. Bereits zugewiesene Rollen ohne Deklaration bleiben in der Auswahl erhalten.')}
                        </small>
                    </h:panelGroup>

                    <h:outputText value="Mandat:"/>
                    <p:selectOneMenu value="#{myUserBackingBean.selected.mandat}"
                                     editable="#{myUserBackingBean.root}"
                                     disabled="#{!myUserBackingBean.root}"
                                     style="width: 360px; max-width: 100%;">
                        <f:selectItem itemLabel="-- Mandat wählen oder neu eingeben --" itemValue="" noSelectionOption="true"/>
                        <f:selectItems value="#{myUserBackingBean.allMandate}"
                                     var="m"
                                     itemLabel="#{m}"
                                     itemValue="#{m}"/>
                    </p:selectOneMenu>

                    <h:outputText value="Zusätzliche Mandate:"
                                  rendered="#{myUserBackingBean.root}"/>
                    <h:panelGroup rendered="#{myUserBackingBean.root}">
                        <p:selectCheckboxMenu value="#{myUserBackingBean.selectedZusatzMandate}"
                                              label="Mandate wählen"
                                              multiple="true"
                                              filter="true" filterMatchMode="contains"
                                              panelStyle="width: 360px; max-width: calc(100vw - 20px);"
                                              style="width: 360px; max-width: 100%;">
                            <f:selectItems value="#{myUserBackingBean.allMandate}"
                                           var="zm" itemLabel="#{zm}" itemValue="#{zm}"/>
                        </p:selectCheckboxMenu>
                        <small style="display: block; margin-top: 5px; color: #6c757d;">
                            Weitere Mandate, zwischen denen dieser Benutzer wechseln darf
                            (zusätzlich zum Heimat-Mandanten oben).
                        </small>
                    </h:panelGroup>

                    <h:outputText value="#{i18n.t('Startseite')}:"/>
                    <p:inputText size="45" value="#{myUserBackingBean.selected.startpage}"/>

                    <h:outputText value="Magic-Link:"/>
                    <h:panelGroup>
                        <p:commandButton value="#{i18n.t('Magic-Link senden')}"
                                         icon="pi pi-envelope"
                                         actionListener="#{myUserBackingBean.sendMagicLink}"
                                         update="messages"
                                         process="@this"/>
                    </h:panelGroup>

                    <h:outputText value="OIDC:"/>
                    <h:panelGroup>
                        <h:outputText value="&#x1F517; #{i18n.t('Verknüpft mit')} #{myUserBackingBean.selected.oidcSubject}"
                                      rendered="#{not empty myUserBackingBean.selected.oidcSubject}"
                                      style="font-size: 0.85rem; color: var(--green-500);"/>
                        <h:outputText value="#{i18n.t('Nicht verknüpft')}"
                                      rendered="#{empty myUserBackingBean.selected.oidcSubject}"
                                      style="font-size: 0.85rem; color: var(--text-color-secondary);"/>
                    </h:panelGroup>

                    <!--
                        The button row sits in the FOOTER of the grid, not as another cell inside it.
                        Two reasons, both of which occurred here: an h:panelGroup knows no colspan
                        (the attribute was silently ignored), and the <br/> in front of it was
                        itself a cell and shifted everything after it by one column.

                        SECURITY (forensics 23 August 2026): if the backing bean demands an explicit
                        confirmation for the revocation of root/admin, the response comes back with
                        validationFailed (the dialog stays open) and rollenEntzugAusstehend
                        is set; then the confirmation prompt is shown instead of saving
                        without comment.
                    -->
                    <f:facet name="footer">
                      <h:panelGroup styleClass="dialog-buttons">
                        <p:commandButton value="#{i18n.t('Speichern')}" icon="pi pi-check" action="#{myUserBackingBean.save()}" update="messages,fm:tbl,rolesMenu,fm:rollenEntzugDlg" oncomplete="if (args &amp;&amp; !args.validationFailed) { PF('dlg').hide(); } else if (#{myUserBackingBean.rollenEntzugAusstehend}) { PF('rollenEntzugDlg').show(); }"/>
                        <p:commandButton value="#{i18n.t('Benutzer löschen')}"
                                         icon="pi pi-trash"
                                         styleClass="ui-button-danger"
                                         actionListener="#{myUserBackingBean.delete()}"
                                         update="messages,fm:tbl"
                                         process="@this"
                                         oncomplete="PF('dlg').hide()"
                                         style="margin-left: 5px;">
                            <p:confirm header="#{i18n.t('Bestätigung')}" message="#{i18n.t('Wollen Sie den Benutzer wirklich löschen?')}" icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>
                      </h:panelGroup>
                    </f:facet>

                </h:panelGrid>
            </p:dialog>

            <!--
                SECURITY (forensics 23 August 2026): confirmation prompt when root revokes privileged roles.
                A non-root user is rejected on the server side already and never sees this dialog.
                The incident that led to this card involved a root actor; that is why a
                purely non-root guard is not enough, root has to confirm the intent.
            -->
            <p:dialog id="rollenEntzugDlg" widgetVar="rollenEntzugDlg" styleClass="mobile-safe"
                      header="#{i18n.t('Rollen-Entzug bestätigen')}"
                      modal="true" resizable="false" closable="false">
                <h:panelGroup layout="block" style="max-width: 420px; margin-bottom: 15px;">
                    <i class="pi pi-exclamation-triangle"
                       style="font-size: 1.4rem; color: var(--orange-500); vertical-align: middle; margin-right: 8px;"/>
                    <h:outputText value="#{myUserBackingBean.rollenEntzugFrage}"/>
                </h:panelGroup>
                <h:panelGroup layout="block" styleClass="dialog-buttons">
                    <p:commandButton value="#{i18n.t('Fortfahren')}"
                                     icon="pi pi-check"
                                     styleClass="ui-button-danger"
                                     action="#{myUserBackingBean.bestaetigeRollenEntzugUndSpeichere()}"
                                     process="@this"
                                     update="messages,fm:tbl,rolesMenu,fm:rollenEntzugDlg"
                                     oncomplete="PF('rollenEntzugDlg').hide(); if (args &amp;&amp; !args.validationFailed) PF('dlg').hide();"/>
                    <p:commandButton value="#{i18n.t('Abbrechen')}"
                                     icon="pi pi-times"
                                     styleClass="ui-button-secondary"
                                     action="#{myUserBackingBean.brichRollenEntzugAb()}"
                                     process="@this"
                                     update="messages,fm:rollenEntzugDlg"
                                     oncomplete="PF('rollenEntzugDlg').hide()"
                                     style="margin-left: 5px;"/>
                </h:panelGroup>
            </p:dialog>

        </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
