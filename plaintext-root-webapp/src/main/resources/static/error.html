<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Fehler</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0;
               display: flex; align-items: center; justify-content: center; min-height: 100vh;
               background: #f5f6f8; color: #2b2f36; }
        .box { background: #fff; padding: 2.5rem 3rem; border-radius: 10px; max-width: 32rem;
               box-shadow: 0 1px 3px rgba(0,0,0,.12); }
        h1 { margin: 0 0 .75rem; font-size: 1.35rem; }
        p  { margin: 0 0 1.25rem; line-height: 1.55; }
        a  { color: #1a5fb4; }
    </style>
</head>
<body>
<div class="box">
    <h1>Da ist etwas schiefgelaufen</h1>
    <p>Die Anfrage konnte nicht verarbeitet werden. Der Fehler wurde protokolliert.</p>
    <p><a href="/">Zurück zur Startseite</a></p>
</div>
</body>
</html>
