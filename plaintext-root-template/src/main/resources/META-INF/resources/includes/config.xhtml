<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">

    <!-- Die serverseitigen Werte kommen als data-Attribute an dieses div und NICHT mehr als
         Inline-Script im Formular: ein woertliches CDATA-Ende innerhalb von h:form beendet die
         CDATA-Sektion jeder Ajax-Antwort vorzeitig, der Browser verwirft sie dann stillschweigend
         (Karte 502, Ursache belegt in Karte 430). Das div liegt ausserhalb des Formulars und wird
         von keinem Ajax-Update angefasst. -->
    <div id="layout-config" class="layout-config"
         data-component-theme="#{userPreferencesBackingBean.componentTheme}"
         data-dark-mode="#{userPreferencesBackingBean.darkMode}"
         data-menu-mode="#{userPreferencesBackingBean.menuMode}"
         data-input-style="#{userPreferencesBackingBean.inputStyle}"
         data-custom-color="#{userPreferencesBackingBean.customColor != null ? userPreferencesBackingBean.customColor : ''}"
         data-theme-colors="#{themeColorProvider.colorsJson}">
        <h:form id="config-form" styleClass="layout-config-form">
            <input type="hidden" name="_csrf" value="#{_csrf.token}"/>
            <h5 style="margin-top: 0">Menu Type</h5>
            <p:selectOneRadio id="menuModeRadio" value="#{userPreferencesBackingBean.menuMode}" layout="pageDirection"
                              onchange="handleChange('menuMode', this.value, function(val) { changeMenuMode(val); });">
                <f:selectItem itemLabel="Horizontal" itemValue="layout-horizontal" />
                <f:selectItem itemLabel="Sidebar" itemValue="layout-sidebar" />
            </p:selectOneRadio>

            <hr/>

            <h5>Color Scheme</h5>
            <p:selectOneRadio id="darkModeRadio" value="#{userPreferencesBackingBean.darkMode}" layout="pageDirection"
                              onchange="handleChange('darkMode', this.value, function(val) { changeDarkMode(val); });">
                <f:selectItem itemLabel="Light" itemValue="light" />
                <f:selectItem itemLabel="Dark" itemValue="dark" />
            </p:selectOneRadio>

            <hr/>

            <h5>Input Style</h5>
            <p:selectOneRadio id="inputStyleRadio" value="#{userPreferencesBackingBean.inputStyle}" layout="pageDirection"
                              onchange="handleChange('inputStyle', this.value, function(val) { changeInputStyle(val); });">
                <f:selectItem itemLabel="Outlined" itemValue="outlined" />
                <f:selectItem itemLabel="Filled" itemValue="filled" />
            </p:selectOneRadio>

            <hr/>

            <h5>Theme Colors</h5>
            <div id="themeColorGrid" style="display:grid; grid-template-columns: repeat(2, 1fr); gap:6px;">
                <!-- Predefined colors (filtered by hidden) -->
                <ui:repeat value="#{userPreferencesBackingBean.visibleComponentThemes}" var="componentTheme">
                    <a href="#" class="theme-color-item#{userPreferencesBackingBean.componentTheme == componentTheme.file ? ' theme-color-selected' : ''}"
                       data-theme-file="#{componentTheme.file}"
                       data-color-type="predefined"
                       style="display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:16px; border:2px solid #{userPreferencesBackingBean.componentTheme == componentTheme.file ? 'var(--pt-primary-color)' : 'var(--pt-surface-border)'}; background:var(--pt-surface-50); text-decoration:none; color:var(--pt-text-color); cursor:pointer; transition:border-color 0.2s; position:relative;">
                        <span style="width:22px; height:22px; min-width:22px; border-radius:50%; background:#{componentTheme.color}; border:1px solid rgba(0,0,0,0.1);"></span>
                        <span style="font-size:0.85rem; flex:1;">#{componentTheme.name}</span>
                        <span class="color-delete-btn" data-pt-delete-color="#{componentTheme.file}"
                              style="font-size:0.7rem; color:var(--pt-text-color-secondary); cursor:pointer; padding:2px 4px; opacity:0.5; transition:opacity 0.2s;"
                              title="Hide color">&#x2715;</span>
                    </a>
                </ui:repeat>

                <!-- Custom colors -->
                <ui:repeat value="#{userPreferencesBackingBean.customColors}" var="namedColor">
                    <a href="#" class="theme-color-item#{userPreferencesBackingBean.componentTheme == 'custom' and userPreferencesBackingBean.customColor == namedColor.hex ? ' theme-color-selected' : ''}"
                       data-theme-file="custom"
                       data-custom-hex="#{namedColor.hex}"
                       data-color-type="custom"
                       data-color-name="#{namedColor.name}"
                       style="display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:16px; border:2px solid #{userPreferencesBackingBean.componentTheme == 'custom' and userPreferencesBackingBean.customColor == namedColor.hex ? 'var(--pt-primary-color)' : 'var(--pt-surface-border)'}; background:var(--pt-surface-50); text-decoration:none; color:var(--pt-text-color); cursor:pointer; transition:border-color 0.2s; position:relative;">
                        <span style="width:22px; height:22px; min-width:22px; border-radius:50%; background:#{namedColor.hex}; border:1px solid rgba(0,0,0,0.1);"></span>
                        <span style="font-size:0.85rem; flex:1;">#{namedColor.name}</span>
                        <span class="color-delete-btn" data-pt-delete-color="#{namedColor.name}"
                              style="font-size:0.7rem; color:var(--pt-text-color-secondary); cursor:pointer; padding:2px 4px; opacity:0.5; transition:opacity 0.2s;"
                              title="Delete color">&#x2715;</span>
                    </a>
                </ui:repeat>

                <!-- Add new color button -->
                <a href="#" id="addColorBtn"
                   style="display:flex; align-items:center; justify-content:center; gap:8px; padding:6px 10px; border-radius:16px; border:2px dashed var(--pt-surface-border); background:var(--pt-surface-50); text-decoration:none; color:var(--pt-text-color-secondary); cursor:pointer; transition:border-color 0.2s;"
                   data-pt-config-aktion="farbe-hinzufuegen-oeffnen">
                    <span style="font-size:1.1rem; font-weight:bold;">+</span>
                    <span style="font-size:0.85rem;">New Color</span>
                </a>
            </div>

            <!-- Add color inline form (hidden by default) -->
            <div id="addColorForm" style="display:none; margin-top:8px; padding:10px; border-radius:16px; border:1px solid var(--pt-surface-border); background:var(--pt-surface-50);">
                <div style="display:flex; align-items:center; gap:8px;">
                    <input type="color" id="newColorPicker" value="#4CAF50"
                           style="width:44px; height:44px; min-width:44px; border:none; padding:0; cursor:pointer; border-radius:50%; overflow:hidden; background:transparent; -webkit-appearance:none;" />
                    <input type="text" id="newColorName" placeholder="Name..."
                           style="flex:1; padding:6px 10px; border-radius:6px; border:1px solid var(--pt-surface-border); background:var(--pt-surface-0); color:var(--pt-text-color); font-size:0.85rem; outline:none;" />
                    <a href="#" data-pt-config-aktion="farbe-hinzufuegen-bestaetigen"
                       style="padding:4px 12px; border-radius:6px; background:var(--pt-primary-color); color:var(--pt-primary-color-text); text-decoration:none; font-size:0.85rem; font-weight:500;">OK</a>
                    <a href="#" data-pt-config-aktion="farbe-hinzufuegen-abbrechen"
                       style="font-size:0.8rem; color:var(--pt-text-color-secondary); text-decoration:none; padding:4px;">&#x2715;</a>
                </div>
            </div>

            <!-- Restore hidden colors link -->
            <div id="restoreColorsLink" style="margin-top:6px; display:#{userPreferencesBackingBean.hasHiddenColors ? 'block' : 'none'};">
                <a href="#" data-pt-config-aktion="farben-wiederherstellen"
                   style="font-size:0.8rem; color:var(--pt-text-color-secondary); text-decoration:underline;">
                    Show all colors
                </a>
            </div>

            <script src="#{request.contextPath}/plaintext-layout/js/config.js"></script>
        </h:form>
    </div>
</ui:composition>
