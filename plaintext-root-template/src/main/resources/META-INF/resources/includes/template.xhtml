<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      lang="#{empty languageBean ? 'en' : languageBean.languageCode}"
      data-theme="#{userPreferencesBackingBean.darkMode}">
<!-- Phase 1 Punkt 4 (schuetu-Fork aufloesen): f:view traegt die App-Locale, wenn die App eine
     languageBean stellt (schuetu-Mehrsprachigkeit). Ohne Bean ist locale null = Default-
     Verhalten, fuer alle uebrigen Apps aendert sich nichts. -->
<f:view locale="#{empty languageBean ? null : languageBean.locale}">

<h:head>
    <f:facet name="first">
        <meta http-equiv="x-ua-compatible" content="IE=edge"/>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
        <meta name="mobile-web-app-capable" content="yes"/>
        <link rel="icon" href="#{request.contextPath}/resources/plaintext-layout/images/favicon.ico" type="image/x-icon"></link>
        <!-- Single dynamic theme - uses CSS variables set below -->
        <h:outputStylesheet library="primefaces-plaintext" name="theme.css"/>
        <style>
            /* Prevent menu flickering on page load */
            body:not(.plaintext-menu-ready) .layout-menu li > ul {
                visibility: hidden !important;
            }
            body.plaintext-menu-ready .layout-menu li > ul {
                visibility: visible;
            }

            /* theme=#{userPreferencesBackingBean.componentTheme} dark=#{userPreferencesBackingBean.darkMode} */
            :root {
                --pt-primary-color: #{themeColorProvider.getPrimaryColor(userPreferencesBackingBean.componentTheme, userPreferencesBackingBean.darkMode, userPreferencesBackingBean.customColor)} !important;
                --pt-primary-color-text: #{themeColorProvider.getPrimaryColorText(userPreferencesBackingBean.componentTheme, userPreferencesBackingBean.customColor)} !important;
                --pt-primary-lighter: #{themeColorProvider.getPrimaryLighter(userPreferencesBackingBean.componentTheme, userPreferencesBackingBean.darkMode, userPreferencesBackingBean.customColor)} !important;
                --pt-primary-bg-16: #{themeColorProvider.getPrimaryBg16(userPreferencesBackingBean.componentTheme, userPreferencesBackingBean.darkMode, userPreferencesBackingBean.customColor)} !important;
                --pt-primary-bg-04: #{themeColorProvider.getPrimaryBg04(userPreferencesBackingBean.componentTheme, userPreferencesBackingBean.darkMode, userPreferencesBackingBean.customColor)} !important;
                --pt-focus-ring-color: #{themeColorProvider.getFocusRing(userPreferencesBackingBean.componentTheme, userPreferencesBackingBean.darkMode, userPreferencesBackingBean.customColor)} !important;
            }

            /* Light mode surface colors */
            html[data-theme="light"] {
                color-scheme: light;
                --pt-surface-0: #ffffff;
                --pt-surface-50: #FAFAFA;
                --pt-surface-hover: #e9ecef;
                --pt-surface-300: #ced4da;
                --pt-surface-400: #adb5bd;
                --pt-surface-border: #dee2e6;
                --pt-text-color: #495057;
                --pt-text-color-secondary: #6c757d;
                --pt-text-dark: #212529;
                --pt-mask-bg: rgba(0, 0, 0, 0.4);
            }

            /* Dark mode surface colors */
            html[data-theme="dark"] {
                color-scheme: dark;
                --pt-surface-0: #1e1e2f;
                --pt-surface-50: #2a2b3d;
                --pt-surface-hover: #3c3d4f;
                --pt-surface-300: #606174;
                --pt-surface-400: #8b8ca0;
                --pt-surface-border: #3c3d4f;
                --pt-text-color: #d4d4dc;
                --pt-text-color-secondary: #a9aabe;
                --pt-text-dark: #d4d4dc;
                --pt-mask-bg: rgba(0, 0, 0, 0.6);
            }
        </style>
    </f:facet>
    <title>
        <ui:insert name="title">#{empty brandingBean ? 'Plaintext App' : brandingBean.effectiveAppName}</ui:insert>
    </title>
    <h:outputScript name="js/layout.js" library="plaintext-layout"/>
    <h:outputScript name="js/primefaces-fixes.js" library="plaintext-layout"/>
    <ui:insert name="head"/>
</h:head>

<h:body styleClass="#{userPreferencesBackingBean.inputStyleClass}">
    <div class="layout-wrapper layout-topbar-#{userPreferencesBackingBean.topbarTheme} layout-menu-#{userPreferencesBackingBean.menuTheme} #{userPreferencesBackingBean.menuMode} #{userPreferencesBackingBean.menuStaticClass}">
        <ui:include src="/includes/topbar.xhtml"/>
        <!-- App-Hook (Phase 1 Punkt 4): Apps legen bei Bedarf eine EIGENE kleine
             /includes/app-template-extra.xhtml in den Classpath (z.B. schuetus Sprach-
             Umschalter) — der Default hier ist leer. So braucht keine App mehr einen
             Komplett-Fork dieses Templates. -->
        <ui:include src="/includes/app-template-extra.xhtml"/>
        <ui:include src="/includes/config.xhtml"/>

        <div class="layout-main">
            <div class="layout-content">
                    <f:metadata>
                        <f:event type="preRenderView" listener="#{pageAccessGuardBackingBean.checkPageAccess()}"/>
                    </f:metadata>
                    <ui:insert name="content"/>
                    <ui:insert name="page"/>
            </div>
            <ui:include src="/includes/footer.xhtml"/>
        </div>

        <!-- Phase 1 JSF-Quick-Wins (Daniel, 28.08.2026): EIN globales Growl + EIN globaler
             ConfirmDialog fuer alle Seiten. Seitenlokale Growls duerfen (vorerst) bestehen
             bleiben — doppelte Anzeige stoert nicht und die Seiten koennen ihre Kopien
             release-weise abbauen. Das eigene kleine Formular ist noetig, weil die
             ConfirmDialog-Buttons innerhalb eines Formulars liegen muessen und das Template
             keine Annahme ueber Seiten-Formulare treffen darf. -->
        <h:form id="globalMessagesForm">
            <input type="hidden" name="_csrf" value="#{_csrf.token}"/>
            <p:growl id="globalGrowl" widgetVar="globalGrowl" showDetail="true" life="5000"/>
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="Ja" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
                <p:commandButton value="Nein" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times"/>
            </p:confirmDialog>
        </h:form>

        <p:ajaxStatus style="width:32px;height:32px;position:fixed;right:7px;bottom:7px">
            <f:facet name="start">
                <i class="pi pi-spin pi-spinner ajax-loader" aria-hidden="true"/>
            </f:facet>

            <f:facet name="complete">
                <h:outputText value=""/>
            </f:facet>
        </p:ajaxStatus>
        <div class="layout-mask modal-in"></div>
    </div>
    <h:outputStylesheet name="css/primeicons.css" library="plaintext-layout"/>
    <h:outputStylesheet name="css/primeflex.min.css" library="plaintext-layout"/>
    <h:outputStylesheet name="css/#{userPreferencesBackingBean.layout}.css" library="plaintext-layout"/>
    <!-- Karte 478: Buttons kleben nie buendig aneinander. Bewusst VOR mobile-responsive.css, damit
         dessen Viewport-Regeln weiterhin die Kaskade gewinnen. -->
    <h:outputStylesheet name="css/button-spacing.css" library="plaintext-layout"/>
    <!-- Zentrales Mobile-Responsive-CSS: MUSS als letztes laden (gewinnt die Kaskade), deckelt Dialoge/Inputs auf den Viewport. -->
    <h:outputStylesheet name="css/mobile-responsive.css" library="plaintext-layout"/>

</h:body>

</f:view>
</html>
