<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">
    <!--
      pt:deleteButton — delete with a confirmation prompt.

      67 almost identical blocks in the existing code: pi pi-trash, embedded p:confirm, update on the
      growl. The embedded p:confirm needs a global p:confirmDialog — since 28 August 2026
      /includes/template.xhtml already provides one (globalMessagesForm), so a page local copy
      is no longer needed for it.

      process="@this" is set and is not optional: without it the whole form runs through validation
      on the click, and an unfilled required field somewhere else entirely
      prevents the delete without any visible reason.

      REQUIRED: action, update
      OPTIONAL: message, header, title, icon, btnClass, btnRendered, btnDisabled, value

      The optional attributes deliberately carry a btn prefix: otherwise a tag file inherits
      identically named attributes of the surrounding tag (e.g. rendered/styleClass of a pt:table).
      Measured on the rendered HTML, 30 August 2026 — see pt:colText.
    -->
    <p:commandButton value="#{value}"
                     icon="#{empty icon ? 'pi pi-trash' : icon}"
                     title="#{empty title ? 'Löschen' : title}"
                     actionListener="#{action}"
                     update="#{update}"
                     process="@this"
                     rendered="#{empty btnRendered ? true : btnRendered}"
                     disabled="#{empty btnDisabled ? false : btnDisabled}"
                     styleClass="ui-button-flat ui-button-danger #{btnClass}">
        <p:confirm header="#{empty header ? 'Löschen' : header}"
                   message="#{empty message ? 'Wirklich löschen?' : message}"
                   icon="pi pi-exclamation-triangle"/>
    </p:commandButton>
</ui:composition>
