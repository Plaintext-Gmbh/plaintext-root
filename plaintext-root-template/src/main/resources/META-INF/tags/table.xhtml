<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">
    <!--
      pt:table — a p:dataTable with the house defaults.

      The existing code (card 984, measured across root and app): 113 hand built tables, 45 of them
      with a paginator in four different rows values, rowsPerPageTemplate in four variants,
      paginatorTemplate in five, and 101 emptyMessage attributes with 80 different
      wordings. None of that was ever a decision — it is whichever copy template
      happened to be nearest.

      ================================================================================
      THE ROW VARIABLE IS ALWAYS CALLED "row" — AND NOT OUT OF TASTE.
      ================================================================================
      A passed through var="#{var}" is technically IMPOSSIBLE, measured on 30 August 2026:

          java.lang.IllegalArgumentException
            at jakarta.faces.component.UIData.setValueExpression(UIData.java:770)

      UIData explicitly forbids a ValueExpression for "var" — the attribute MUST be a
      literal. As soon as #{var} appears in the tag file, Mojarra creates a ValueExpression and the
      page ends in HTTP 500. The original analysis did not mention this point; it is
      documented here by a real page request and not by reasoning.

      Consequence for the migration: whoever converts a table to pt:table renames its
      row variable to "row" — #{t.name} becomes #{row.name}. That is mechanical and
      fully verifiable by the compiler or by requesting the page.

      WHOEVER DOES NOT WANT THAT keeps a hand built p:dataTable and still uses the
      pt:col* tags: those need no var and work in any table. The bigger lever
      lies there anyway (around 400 columns against 113 table headers).

      REQUIRED: value
      OPTIONAL: id, emptyMessage, paginator, rows, rowsPerPageTemplate, styleClass, rowStyleClass,
                rendered, widgetVar, reflow

      All defaults can be overridden: whoever has a reason sets the attribute, and then
      the reason stands in exactly one visible place instead of in the copy.
    -->
    <p:dataTable id="#{empty id ? 'tbl' : id}"
                 value="#{value}"
                 var="row"
                 widgetVar="#{widgetVar}"
                 rendered="#{empty rendered ? true : rendered}"
                 emptyMessage="#{empty emptyMessage ? 'Keine Einträge vorhanden' : emptyMessage}"
                 paginator="#{empty paginator ? true : paginator}"
                 rows="#{empty rows ? 20 : rows}"
                 rowsPerPageTemplate="#{empty rowsPerPageTemplate ? '10,20,50,100,200' : rowsPerPageTemplate}"
                 paginatorPosition="bottom"
                 reflow="#{empty reflow ? true : reflow}"
                 rowStyleClass="#{rowStyleClass}"
                 styleClass="mobile-safe #{styleClass}">
        <ui:insert/>
    </p:dataTable>
</ui:composition>
