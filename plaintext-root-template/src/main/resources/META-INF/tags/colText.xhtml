<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:c="jakarta.tags.core"
                xmlns:p="http://primefaces.org/ui">
    <!--
      pt:colText — the simplest and most frequent column: a header plus one value.
      In the existing code that is four to five lines for one piece of information; here it is one.

      REQUIRED: header, value
      OPTIONAL: width, style, colClass, colRendered, bold

      ================================================================================
      TWO TRAPS, BOTH MEASURED ON RENDERED HTML ON 30 August 2026 — NOT GUESSED:
      ================================================================================
      1. ATTRIBUTE NAMES LEAK IN FROM OUTSIDE. A tag file sees the attributes of the
         surrounding tag file when it is not given them itself. If the attribute here were called
         "styleClass", EVERY cell would inherit the styleClass of the pt:table — in the pilot,
         class="token-table" then sat on every single td. That is why the optional attributes are
         called colClass and colRendered and collide with no attribute of pt:table.
         "value" and "header" are required and are always set; they cannot inherit.

      2. AN UNSET ATTRIBUTE IS NOT THE SAME AS A MISSING ONE. If this file contained
         sortBy="#{sortBy}" and somebody called the tag without sortBy, Facelets would still create
         an (empty) ValueExpression — PrimeFaces saw a set sortBy and made the column
         sortable AND filterable, complete with a filter input field in the header. Sorting therefore
         does not belong in this tag: whoever needs it writes the p:column out in full. A tag that
         builds in controls unasked would be worse than four saved lines are good.
    -->
    <p:column headerText="#{header}"
              rendered="#{empty colRendered ? true : colRendered}"
              styleClass="#{colClass}"
              style="#{empty width ? style : 'width:'.concat(width).concat(';').concat(empty style ? '' : style)}">
        <c:choose>
            <c:when test="#{bold}">
                <h:outputText value="#{value}" style="font-weight:600;"/>
            </c:when>
            <c:otherwise>
                <h:outputText value="#{value}"/>
            </c:otherwise>
        </c:choose>
    </p:column>
</ui:composition>
