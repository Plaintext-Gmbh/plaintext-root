<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui">
    <!--
      pt:colDate — date column with ONE house format.

      Measured inventory: dd.MM.yyyy HH:mm 27x, dd.MM.yyyy 12x, plus five scattered variants. With
      nothing specified you get date and time; withTime="false" gives the date only. A custom pattern
      remains possible, but is then a visible exception instead of a silent one.

      type defaults to localDateTime — the type of the SuperModel timestamps. For LocalDate:
      type="localDate" and withTime="false".

      CAUTION: only for real date/time values. Where the backing bean already delivers a ready
      formatted string (frequent in the existing code, e.g. the ApiToken view DTOs),
      pt:colText is what belongs there — a converter on a string throws at runtime.

      Attribute names deliberately colClass/colRendered as in pt:colText — reasoning there.

      REQUIRED: header, value
      OPTIONAL: width, pattern, type, withTime, colClass, colRendered
    -->
    <p:column headerText="#{header}"
              rendered="#{empty colRendered ? true : colRendered}"
              styleClass="#{colClass}"
              style="width:#{empty width ? '140px' : width};">
        <h:outputText value="#{value}">
            <f:convertDateTime type="#{empty type ? 'localDateTime' : type}"
                               pattern="#{not empty pattern ? pattern : (withTime eq false ? 'dd.MM.yyyy' : 'dd.MM.yyyy HH:mm')}"/>
        </h:outputText>
    </p:column>
</ui:composition>
