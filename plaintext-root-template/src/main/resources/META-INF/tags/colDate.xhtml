<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui">
    <!--
      pt:colDate — Datumsspalte mit EINEM Hausformat.

      Gemessener Bestand: dd.MM.yyyy HH:mm 27x, dd.MM.yyyy 12x, dazu fuenf Streuvarianten. Ohne
      Angabe gibt es Datum und Uhrzeit; withTime="false" nur das Datum. Ein eigenes pattern bleibt
      moeglich, ist dann aber eine sichtbare Ausnahme statt einer stillen.

      type ist per Vorgabe localDateTime — der Typ der SuperModel-Zeitstempel. Fuer LocalDate:
      type="localDate" und withTime="false".

      ACHTUNG: Nur fuer echte Datums-/Zeitwerte. Wo die BackingBean bereits einen fertig
      formatierten String liefert (im Bestand haeufig, z.B. die ApiToken-View-DTOs), gehoert
      pt:colText hin — ein Konverter auf einem String wirft zur Laufzeit.

      Attributnamen wie bei pt:colText bewusst colClass/colRendered — Begruendung dort.

      PFLICHT: header, value
      OPTIONAL: width, pattern, type, withTime, colClass, colRendered
    -->
    <p:column headerText="#{header}"
              rendered="#{empty colRendered ? true : colRendered}"
              styleClass="#{colClass}"
              style="width:#{empty width ? '140px' : width};">
        <h:outputText value="#{value}">
            <f:convertDateTime type="#{empty type ? 'localDateTime' : type}"
                               pattern="#{not empty pattern ? pattern : (withTime eq false ? 'dd.MM.yyyy' : 'dd.MM.yyyy HH:mm')}"/>
        </h:outputText>
    </p:column>
</ui:composition>
