<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui">
    <!--
      pt:colAmount — amount column: ONE number format, right aligned.

      Measured inventory: #,##0.00 49x plus seven variants, CHF currency 5x; the alignment sometimes
      set, sometimes not. Stacked amounts with wandering decimal separators are the most common
      reason why a list feels restless without anybody being able to say why.

      Attribute names deliberately colClass/colRendered as in pt:colText — reasoning there.

      REQUIRED: header, value
      OPTIONAL: width, pattern, currency, colClass, colRendered
    -->
    <p:column headerText="#{header}"
              rendered="#{empty colRendered ? true : colRendered}"
              styleClass="#{colClass}"
              style="width:#{empty width ? '120px' : width}; text-align:right;">
        <h:outputText value="#{value}">
            <f:convertNumber pattern="#{empty pattern ? '#,##0.00' : pattern}"/>
        </h:outputText>
        <h:outputText value=" #{currency}" rendered="#{not empty currency}"/>
    </p:column>
</ui:composition>
