<?xml version="1.0" encoding="UTF-8"?>
<!--
  Template for every watch page. A page supplies "inhalt"; header, navigation and the
  stylesheet come from here, so no module has to repeat them.
  See WATCH-UI-GUIDE.md for the CSS classes.

  ACCESS (changed by card 1257, 19.09.2026). Until now this comment said the pages lie behind
  the normal sign-in and a token in the URL "would buy nothing". That decision was reversed:
  Daniel wants a personal link that works on a phone WITHOUT signing in. The pages still do not
  lie under /nosec/ — only the entry point /nosec/watch does. It reads the token ONCE, exchanges
  it for a server-side session and redirects here without it.

  The three costs the old comment named are not gone, they are paid:
    * log      — the token appears in the access log of the entry request and nowhere else;
                 the application itself never logs it, not even truncated.
    * history  — a redirect replaces the history entry, so the address with the token is not
                 even behind the back button.
    * referrer — the meta below sends none, from any watch page.
  On top of that the session is bound to the token: every request re-checks it against
  api_token, so a revoked link dies on the next tap instead of at the session timeout, and
  WatchTokenSitzungFilter answers 403 for anything that is not a watch page.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets">

    <!-- Directly below ui:composition, never inside h:body or h:form: JSF collects the metadata
         before the view is built. Inside the body the preRenderView listener never fires and the
         page renders empty — the very fault that kept the alkohol evaluation blank (card 1243). -->
    <f:metadata>
        <f:event type="preRenderView" listener="#{watchFrameBean.seitenaufruf()}"/>
        <!-- A page loads its own data here. It cannot bring its own f:metadata: a page using
             this template contributes ui:define blocks only, and JSF takes the metadata from
             the view root — which is this file. Without this insert a module bean is never
             called and its page stays empty no matter what the user has recorded. -->
        <ui:insert name="laden"/>
    </f:metadata>

    <h:head>
        <meta charset="utf-8"/>
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
        <meta name="robots" content="noindex,nofollow"/>
        <!-- Karte 1257: keine Verweisadresse nach draussen. Die Uhr wird ueber einen Link mit
             Token geoeffnet; ohne diese Zeile stuende die Einstiegsadresse samt Token im
             Referer jedes Aufrufs, den eine Seite von hier aus macht. -->
        <meta name="referrer" content="no-referrer"/>
        <!-- Starts full screen from the home screen, without the Safari bars — one tap. -->
        <meta name="apple-mobile-web-app-capable" content="yes"/>
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
        <meta name="mobile-web-app-capable" content="yes"/>
        <meta name="theme-color" content="#0b0b0f"/>
        <h:outputStylesheet library="watch" name="watch.css"/>
        <!-- Karte 1276: der lange Druck auf den Vorwaerts-Knopf. Als Datei, nicht inline —
             siehe die Begruendung am Knopf unten. `target="body"` waere hier falsch: das
             Skript verdrahtet sich selbst ueber DOMContentLoaded. -->
        <h:outputScript library="watch" name="watch.js"/>
        <title><ui:insert name="titel">Watch</ui:insert></title>
    </h:head>

    <h:body>
        <div class="w-wrap">
            <div class="w-head">
                <h1><h:outputText value="#{watchFrameBean.titel}"/></h1>
                <span class="w-pos"><h:outputText value="#{watchFrameBean.position}"/></span>
            </div>

            <ui:insert name="inhalt"/>

            <h:form id="nav">
                <input type="hidden" name="_csrf" value="#{_csrf.token}"/>
                <!-- Ohne dieses Feld endet jeder Knopfdruck in einer Whitelabel-Seite:
                     PrimeFaces vergleicht bei jedem Postback die Nonce, und sein eigenes
                     JavaScript haengt den Parameter an — das es hier nicht gibt (Karte 1256). -->
                <input type="hidden" name="primefaces.nonce" value="#{watchFrameBean.cspNonce}"/>
                <!-- ── EIN KNOPF STATT DREI (Karte 1276, Daniel 19.09.2026) ──────────────────
                     "Das mittlere menue braucht es nicht beim navigieren ... Navigieren nur
                     vorwaerts und mit einem einzelnen button"

                     Hier standen ‹ zurueck, ≡ Uebersicht und › weiter. Auf einem 40-mm-Bildschirm
                     teilen sich drei Knoepfe die Breite, die einer braucht — und der Finger
                     verdeckt beim Tippen ohnehin alle drei.

                     ZURUECK ENTFAELLT ERSATZLOS. Der Umlauf ist geschlossen: wer einmal zu weit
                     tippt, ist nach n-1 weiteren Tippern wieder da. Bei vier bis sechs Seiten ist
                     das billiger als ein zweiter Knopf, den man auf dieser Groesse schlecht trifft.

                     DIE UEBERSICHT HAENGT JETZT AM LANGEN DRUCK (Entscheid Daniel). Sie laeuft
                     seit Karte 1260 bewusst nicht im Umlauf mit, war also nur ueber ≡ erreichbar.
                     Ohne Ersatz waere sie von der Uhr aus verschwunden — die Seiten-Schalter gibt
                     es zwar auch in der normalen App unter Watch-Einstellungen, aber nicht in der
                     Hand.

                     Der Preis steht im Hinweis: ein langer Druck ist nicht sichtbar. Deshalb die
                     Zeile "lang druecken: Uebersicht" — ohne sie findet es niemand, und eine
                     Funktion, die man nicht findet, gibt es nicht. Seit Karte 1312 steht sie IM
                     Knopf statt darunter. -->
                <!-- ── DER HINWEIS STEHT IM KNOPF (Karte 1312, Daniel 20.09.2026) ───────────
                     "lan klick: Uebersicht im button und button schrift groesser"

                     Bis hierher war der Hinweis ein eigenes Element UNTER dem Knopf, mit eigener
                     Klasse (aus watch.css entfernt). Auf Daniels Bild las er sich wie eine Fussnote
                     der Seite — dabei beschreibt er eine Eigenschaft genau dieses Knopfes. Jetzt
                     steht er in dessen Rechteck, und das Zeichen darueber traegt die groesste
                     Schrift der Seite (eigene Groessenvariable in watch.css).

                     WARUM NICHT EINFACH ALS ZWEITE ZEILE IM value: h:commandButton rendert
                     <input type="submit"> — ein leeres Element ohne Kinder und ohne zweite
                     Zeile. Der Text steht darum neben dem Eingabefeld, .w-aktion ist optisch der
                     Knopf und das Eingabefeld liegt durchsichtig ueber dem ganzen Kasten. Die
                     Trefferflaeche ist damit genau das, was man sieht.

                     Der Aufbau ist derselbe wie bei der Komponente w:aktion; hier steht er von
                     Hand, weil der Knopf zusaetzlich das data-Attribut fuer den langen Druck
                     traegt. -->
                <div class="w-nav">
                    <h:panelGroup layout="block" styleClass="w-aktion">
                        <span class="w-aktion-wort">›</span>
                        <h:panelGroup layout="block" styleClass="w-aktion-hinweis"
                                      rendered="#{not empty watchFrameBean.uebersichtAdresse}">
                            lang drücken: Übersicht
                        </h:panelGroup>
                        <h:commandButton styleClass="w-aktion-flaeche" value="weiter"
                                         action="#{watchFrameBean.weiter}">
                            <!-- Das Ziel als data-Attribut, nicht als onclick: Inline-JavaScript ist
                                 per PlaintextInlineJsVertragTest verboten, damit die CSP ohne
                                 script-src 'unsafe-inline' auskommt. watch.js liest es aus.
                                 Fehlt die Uebersicht (kein sichtbarer Eintrag ausserhalb des Umlaufs),
                                 fehlt das Attribut, und der Knopf bleibt ein reiner Vorwaerts-Knopf. -->
                            <f:passThroughAttribute name="data-lang-ziel"
                                                    value="#{empty watchFrameBean.uebersichtAdresse ? '' : request.contextPath.concat(watchFrameBean.uebersichtAdresse)}"/>
                        </h:commandButton>
                    </h:panelGroup>
                </div>
            </h:form>
        </div>
    </h:body>
</ui:composition>
