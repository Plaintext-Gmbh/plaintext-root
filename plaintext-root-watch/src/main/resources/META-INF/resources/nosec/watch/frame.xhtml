<?xml version="1.0" encoding="UTF-8"?>
<!--
  Template for every watch page. A page supplies "inhalt"; header, navigation and the
  stylesheet come from here, so no module has to repeat them.
  See WATCH-UI-GUIDE.md for the CSS classes.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets">
<h:head>
    <meta charset="utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <meta name="robots" content="noindex,nofollow"/>
    <!-- Starts full screen from the home screen, without the Safari bars; the token stays in
         the saved URL, so it is a one-tap start. Same approach as the existing uhr.xhtml. -->
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="theme-color" content="#0b0b0f"/>
    <h:outputStylesheet library="watch" name="watch.css"/>
    <title><ui:insert name="titel">Watch</ui:insert></title>
</h:head>
<h:body>
    <f:metadata>
        <f:event type="preRenderView" listener="#{watchFrameBean.seitenaufruf()}"/>
    </f:metadata>

    <div class="w-wrap">
        <div class="w-head">
            <h1>#{watchFrameBean.titel}</h1>
            <span class="w-pos">#{watchFrameBean.position}</span>
        </div>

        <ui:insert name="inhalt"/>

        <h:form id="nav">
            <input type="hidden" name="_csrf" value="#{_csrf.token}"/>
            <div class="w-nav">
                <h:commandButton styleClass="w-btn" value="‹" action="#{watchFrameBean.zurueck}"/>
                <h:commandButton styleClass="w-btn" value="›" action="#{watchFrameBean.weiter}"/>
            </div>
        </h:form>
    </div>
</h:body>
</ui:composition>
