# Simulates an application's own application.yml inside the test.
#
# It is loaded via spring.config.name=test-eigene-app so that it does NOT shadow the real
# application.yml of the other tests in this module — that would be the very mistake this
# test is meant to expose.
#
# The values are deliberately different from those in plaintext-defaults.yml: only that way
# does the result show which source won.
server:
  servlet:
    session:
      cookie:
        same-site: strict
        secure: true
