# Gemeinsame Grundeinstellungen fuer ALLE Plaintext-Anwendungen.
#
# WARUM DIESE DATEI EXISTIERT (Karte 620):
# Diese Werte standen frueher in plaintext-root-webapp/application.yml. Spring Boot laedt aber
# nur EINE classpath:/application.yml — und jede konsumierende Anwendung bringt eine eigene mit.
# Die root-Fassung war damit in den Consumern unsichtbar.
#
# Der Dateiname ist deshalb bewusst NICHT application.yml: Er kann nicht verdeckt werden.
# Eingespeist wird sie vom PlaintextDefaultsEnvironmentPostProcessor mit der NIEDRIGSTEN
# Praezedenz — jede App, jedes Profil und jede Umgebungsvariable ueberschreibt sie weiterhin.
#
# WAS HIER HINEINGEHOERT: Werte, die ohne Zutun der App ueberall gelten sollen.
# WAS NICHT: alles App-Spezifische. Das gehoert in die application.yml der App.

server:
  servlet:
    session:
      timeout: ${PLAINTEXT_SESSION_TIMEOUT:30m}
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        # Haertung — je Instanz per Umgebungsvariable gesetzt, nicht fest verdrahtet.
        # Der Default ist hier bewusst false (anders als in plaintext-root-webapp, wo er true
        # lautet); Begruendung und Betriebsfallen stehen in der internen Betriebsdokumentation:
        # plaintext-config/docs/SECURITY_ENTSCHEIDE.md. Nicht ohne Ruecksprache aendern.
        secure: ${PLAINTEXT_COOKIE_SECURE:false}

# SECURITY (Karte 623): Swagger-UI und OpenAPI-Beschreibung sind aus.
#
# Zentral hier und nicht je App: Es ist keine neue Bewertung, sondern das Nachziehen einer in
# root bereits getroffenen Entscheidung (Karte 314). Haertung — nicht ohne Ruecksprache
# aendern; Hintergrund in plaintext-config/docs/SECURITY_ENTSCHEIDE.md.
#
# Zum Einschalten in DEV genuegt SPRINGDOC_ENABLED=true.
springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  show-actuator: false
