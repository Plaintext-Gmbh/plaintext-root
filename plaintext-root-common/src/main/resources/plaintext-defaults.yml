# Shared baseline settings for ALL Plaintext applications.
#
# WHY THIS FILE EXISTS (card 620):
# These values used to live in plaintext-root-webapp/application.yml. Spring Boot, however, loads
# only ONE classpath:/application.yml — and every consuming application brings its own.
# The root version was therefore invisible in the consumers.
#
# That is why the file name is deliberately NOT application.yml: it cannot be shadowed.
# It is fed in by PlaintextDefaultsEnvironmentPostProcessor with the LOWEST precedence — every
# app, every profile and every environment variable still overrides it.
#
# WHAT BELONGS HERE: values that are meant to apply everywhere without the app doing anything.
# WHAT DOES NOT: anything app-specific. That belongs in the app's own application.yml.

server:
  servlet:
    session:
      timeout: ${PLAINTEXT_SESSION_TIMEOUT:30m}
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        # Hardening — set per instance via an environment variable, not hard-wired.
        # The default here is deliberately false (unlike in plaintext-root-webapp, where it is
        # true); the rationale and the operational pitfalls are in the internal operations
        # documentation: plaintext-config/docs/SECURITY_ENTSCHEIDE.md. Do not change without asking.
        secure: ${PLAINTEXT_COOKIE_SECURE:false}

# SECURITY (card 623): Swagger UI and the OpenAPI description are off.
#
# Centrally here and not per app: this is not a fresh assessment but the roll-out of a decision
# already taken in root (card 314). Hardening — do not change without asking; background in
# plaintext-config/docs/SECURITY_ENTSCHEIDE.md.
#
# To switch it on in DEV, SPRINGDOC_ENABLED=true is enough.
springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  show-actuator: false
