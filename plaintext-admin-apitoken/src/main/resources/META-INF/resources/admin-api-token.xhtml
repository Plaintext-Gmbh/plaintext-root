<ui:composition xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:pt="http://plaintext.ch/ui"
                xmlns="http://www.w3.org/1999/xhtml" template="/includes/template.xhtml">

    <f:metadata>
        <f:event type="preRenderView" listener="#{adminApiTokenBean.onLoad()}"/>
    </f:metadata>

    <ui:define name="title">API Tokens (Admin)</ui:define>

    <ui:define name="content">
        <h:form id="fm">
            <input type="hidden" name="_csrf" value="#{_csrf.token}"/>

            <p:growl id="messages" showDetail="true" life="5000"/>

            <p:fieldset id="fs1" legend="API Tokens - Mandatsübersicht">

                <h:panelGrid columns="1" style="width: 100%; margin-bottom: 20px;">
                    <h:outputText value="Übersicht aller aktiven API-Tokens in Ihrem Mandat. Sie können Tokens invalidieren, aber nicht löschen (Audit-Trail)."
                                  style="font-style: italic; color: #666;"/>
                </h:panelGrid>

                <p:outputPanel id="tokenTable">

                    <h:panelGrid columns="1" style="width: 100%;" rendered="#{!adminApiTokenBean.hasTokens()}">
                        <h:outputText value="Es gibt keine aktiven API-Tokens in diesem Mandat." style="color: #666; font-style: italic;"/>
                    </h:panelGrid>

                    <!-- Karte 984, Pilotmigration auf die pt:-Taglib.
                         paginator="false" ist hier Absicht und keine Nachlaessigkeit: Diese
                         Migration soll BELEGEN, dass die Tag-Files identisches Markup erzeugen.
                         Mit den Hausvorgaben (Paginator an) waere der Vergleich vorher/nachher
                         verrauscht und bewiese nichts. Die Uebernahme der Vorgaben ist ein
                         eigener, sichtbarer Schritt. -->
                    <pt:table value="#{adminApiTokenBean.tokens}"
                              paginator="false"
                              rendered="#{adminApiTokenBean.hasTokens()}"
                              styleClass="token-table"
                              rowStyleClass="#{row.expired ? 'expired-row' : (row.expiresSoon ? 'warning-row' : '')}">

                        <p:column headerText="Benutzer" style="width: 180px;">
                            <h:outputText value="#{row.userEmail}"/>
                            <br/>
                            <h:outputText value="(ID: #{row.userId})" style="font-size: 11px; color: #666;"/>
                        </p:column>

                        <pt:colText header="Token-Name" width="180px" value="#{row.tokenName}" bold="true"/>

                        <p:column headerText="Gültig bis" style="width: 140px;">
                            <h:panelGroup rendered="#{row.expired}">
                                <i class="pi pi-exclamation-circle" style="color: #dc3545;"/>
                                <h:outputText value=" Abgelaufen" style="color: #dc3545; font-weight: bold;"/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{!row.expired and row.expiresSoon}">
                                <i class="pi pi-exclamation-triangle" style="color: #ffc107;"/>
                                <h:outputText value=" #{row.expiresAt}" style="color: #856404;"/>
                                <br/>
                                <h:outputText value="(#{row.daysUntilExpiry} Tage)" style="font-size: 11px; color: #856404;"/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{!row.expired and !row.expiresSoon}">
                                <h:outputText value="#{row.expiresAt}"/>
                                <br/>
                                <h:outputText value="(#{row.daysUntilExpiry} Tage)" style="font-size: 11px; color: #666;"/>
                            </h:panelGroup>
                        </p:column>

                        <pt:colText header="Zuletzt verwendet" width="140px" value="#{row.lastUsedAt}"/>

                        <pt:colText header="Verwendet" width="90px" style="text-align:center;" value="#{row.useCount}x"/>

                        <pt:colText header="Erstellt" width="140px" value="#{row.createdAt}"/>

                        <p:column headerText="Aktion" style="width: 100px;">
                            <p:commandButton icon="pi pi-ban"
                                             styleClass="ui-button-danger ui-button-rounded"
                                             title="Token invalidieren"
                                             action="#{adminApiTokenBean.invalidateToken(row.id)}"
                                             update=":fm:tokenTable,:fm:messages"
                                             process="@this">
                                <p:confirm header="Token invalidieren?"
                                           message="Der Token '#{row.tokenName}' von Benutzer #{row.userEmail} wird unwiderruflich invalidiert. Fortfahren?"
                                           icon="pi pi-exclamation-triangle"/>
                            </p:commandButton>
                        </p:column>

                    </pt:table>

                </p:outputPanel>

            </p:fieldset>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="Ja" type="button" styleClass="ui-confirmdialog-yes ui-button-danger"/>
                <p:commandButton value="Nein" type="button" styleClass="ui-confirmdialog-no"/>
            </p:confirmDialog>

        </h:form>

        <style>
            .token-table .expired-row {
                background-color: #f8d7da !important;
            }
            .token-table .warning-row {
                background-color: #fff3cd !important;
            }
        </style>
    </ui:define>
</ui:composition>
