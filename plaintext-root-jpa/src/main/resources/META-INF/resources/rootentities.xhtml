<ui:composition xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                template="/includes/template.xhtml">

    <f:metadata>
        <f:event type="preRenderView" listener="#{rootEntityBackingBean.initThis()}"/>
    </f:metadata>

    <ui:define name="title">#{i18n.t('Datenverwaltung')} (Root)</ui:define>

    <ui:define name="page">
        <!-- Status report 29 August 2026 (R2): page body shared with adminentities.xhtml,
             see /includes/entityverwaltung.xhtml. Root: all tenants, with JSON export/import. -->
        <ui:include src="/includes/entityverwaltung.xhtml">
            <ui:param name="bean" value="#{rootEntityBackingBean}"/>
            <ui:param name="pageUrl" value="/rootentities.html"/>
            <ui:param name="exportImport" value="#{true}"/>
        </ui:include>
    </ui:define>
</ui:composition>
