name: Playwright UI Tests

# Optional check: runs the Playwright integration tests in
# plaintext-root-webapp on every PR to master and on every push to a
# feature branch. The tests boot the full Spring application against a
# Testcontainers-managed PostgreSQL on a random port, so no external
# infrastructure is required — only Docker (preinstalled on the runner)
# and the Chromium browser that Playwright downloads itself.
#
# This workflow does NOT block merges. The required PR checks live in
# ci-cd.yaml ("pipeline / Build & Test"). UI failures should be visible
# but not stop a security-fix merge if the cause is unrelated.

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  playwright:
    if: ${{ !contains(github.event.head_commit.message, '[skip-ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        # Kein 'submodules: recursive': das Repo hat keine .gitmodules/Gitlinks mehr; der
        # Recursive-Checkout scheiterte an einer veralteten 'plaintext-config'-Referenz
        # ("No url found for submodule path 'plaintext-config'") und liess den Check
        # auf jedem PR rot werden (5s-Fehlschlag im Checkout).

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build dependencies (no tests)
        # MUSS vor dem Classpath-Bau laufen: legt die internen SNAPSHOT-Module
        # (plaintext-root-interfaces/-common …) ins lokale Repo. Sonst scheitert der
        # folgende 'dependency:build-classpath' an deren Auflösung
        # ("Could not find artifact ch.plaintext:plaintext-root-interfaces:…-SNAPSHOT")
        # und der ganze Playwright-Check wird rot, bevor ein Test überhaupt läuft.
        run: mvn -B -q -DskipTests install

      - name: Install Chromium for Playwright
        # Pulls a Java-friendly Chromium build into ~/.cache/ms-playwright.
        # Failsafe will pick it up automatically when the IT class boots.
        run: |
          mvn -B -q dependency:build-classpath \
              -Dmdep.outputFile=/tmp/cp.txt \
              -pl plaintext-root-webapp -am
          java -cp "$(cat /tmp/cp.txt):plaintext-root-webapp/target/classes" \
              com.microsoft.playwright.CLI install --with-deps chromium

      - name: Run Playwright integration tests
        run: |
          mvn -B -pl plaintext-root-webapp \
              failsafe:integration-test failsafe:verify \
              -Dit.test=SelfServicePlaywrightIT

      - name: Upload surefire/failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            plaintext-root-webapp/target/failsafe-reports
            plaintext-root-webapp/target/surefire-reports
          retention-days: 7
