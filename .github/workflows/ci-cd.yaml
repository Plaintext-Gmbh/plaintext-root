name: Build And Deploy

on:
  workflow_dispatch:
    inputs:
      deploy-target:
        description: 'Was der manuelle Lauf tun soll'
        type: choice
        options:
          - ci-only
          - release-all
        default: ci-only
  schedule:
    - cron: '0 3 * * *'   # Nightly: schneller Test-Build (ci-only, KEIN Sonar)
    - cron: '0 4 * * 1'   # Weekly Mo 04:00: Voll-Analyse (Sonar + OWASP-CVE + SpotBugs + Quality-Gate)
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Karte 433: Die alte Bedingung prueft die GANZE Commit-Message. Beim Squash-Merge zieht
  # GitHub saemtliche Einzel-Commit-Messages des Branches in den Body — stand in irgendeiner
  # davon "[skip-ci]" (etwa im automatischen Quality-Gate-Commit), wurde der komplette Deploy
  # lautlos uebersprungen: Lauf "skipped", nicht "failed", also ohne rote Markierung. So blieb
  # am 02.08.2026 ein CVE-Fix mit CVSS 9.1 ungerollt.
  #
  # Die Absicht steht in der Betreffzeile, nicht im geerbten Body. Die Ausdruckssprache von
  # GitHub Actions kann Strings nicht zerlegen (kein split, keine Regex, kein Feld nur fuer die
  # Betreffzeile) — deshalb dieser Shell-Schritt, dessen Ergebnis die Bedingung unten liest.
  skip-pruefung:
    runs-on: ['self-hosted', 'nas']
    outputs:
      skip: ${{ steps.pruefung.outputs.skip }}
    steps:
      - id: pruefung
        env:
          # Ueber env, nicht per Interpolation in den Skripttext: eine Commit-Message darf
          # Anfuehrungszeichen und Backticks enthalten.
          MSG: ${{ github.event.head_commit.message }}
        run: |
          BETREFF="$(printf '%s' "$MSG" | head -1)"
          if printf '%s' "$BETREFF" | grep -qF '[skip-ci]'; then
            echo "Betreffzeile traegt [skip-ci] — Lauf wird uebersprungen: $BETREFF"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  pipeline:
    needs: skip-pruefung
    if: needs.skip-pruefung.outputs.skip != 'true'
    uses: Plaintext-Gmbh/plaintext-scripts/.github/workflows/ci-cd-pipeline.yaml@master
    with:
      deploy-target: >-
        ${{ github.event_name == 'schedule' && 'ci-only'
         || github.event_name == 'pull_request' && 'ci-only'
         || github.event_name == 'workflow_dispatch' && github.event.inputs.deploy-target
         || (github.ref == 'refs/heads/master' && 'release-all' || 'snapshot-dev') }}
      project-name: plaintext-root
      database-name: plaintext_root
      # Deploy-Ziele kommen aus Repository-Variablen (Settings -> Variables), damit
      # hier keine umgebungsspezifischen Adressen im oeffentlichen Repo stehen.
      dev-url: ${{ vars.DEPLOY_DEV_URL }}
      prod-url: ${{ vars.DEPLOY_PROD_URL }}
      # Sonar + Voll-Analyse NUR wöchentlich (Mo 04:00); nightly bleibt schnell. Dispatch = manueller
      # Voll-Lauf, standardmässig ohne Deploy (siehe deploy-target oben).
      sonar-enabled: ${{ github.event.schedule == '0 4 * * 1' || github.event_name == 'workflow_dispatch' }}
      quality-analysis: ${{ github.event.schedule == '0 4 * * 1' || github.event_name == 'workflow_dispatch' }}
      # Build/Deploy laufen auf einem self-hosted Runner im Zielnetz; der Postgres-Host-Port
      # ist projektspezifisch gewaehlt, damit sich parallele Integrationstest-DBs auf einem
      # geteilten Docker-Daemon nicht in die Quere kommen.
      runner: '["self-hosted", "nas"]'
      postgres-port: '5434'
    # Caller und reusable Workflow haben denselben Owner -> `secrets: inherit` funktioniert und
    # reicht alle benoetigten Secrets durch, ohne sie einzeln pflegen zu muessen.
    # Hinweis: Bei Pull Requests aus Forks stellt GitHub keine Secrets bereit; die Pipeline
    # laeuft dann als reiner Build/Test-Lauf (deploy-target `ci-only`) ohne Deploy.
    secrets: inherit
