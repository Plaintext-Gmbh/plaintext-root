name: Build And Deploy

on:
  workflow_dispatch:
    inputs:
      deploy-target:
        # Karte 904 (aus 902): 'release-all' ist hier ABSICHTLICH nicht mehr waehlbar, solange
        # plaintext-root stillgelegt ist (Karte 776, 12.08.2026). Die Option deployt Container,
        # und die gibt es nicht mehr — der Lauf scheitert dann am fehlenden plaintext-root-db-int,
        # nachdem er den Service trotz 'profiles: ["stillgelegt"]' hochgefahren hat (das Profil
        # greift nicht, weil das Deploy-Skript den Service NAMENTLICH startet).
        #
        # Ein blosser Kommentar haette das nicht verhindert: im GitHub-UI sieht man beim Starten
        # nur die Optionsnamen und diese description, keine Kommentarzeilen. Genau so ist es am
        # 17.08.2026 passiert.
        #
        # BEIM WIEDERANSCHALTEN von root gehoert '- release-all' hier zurueck, zusammen mit:
        #   - den 'stillgelegt'-Profilen in /volume1/docker/plaintext-root/docker-compose.yaml
        #   - 'release-only' -> 'release-all' und 'ci-only' -> 'snapshot-dev' im deploy-target
        #     weiter unten in dieser Datei
        #   - dem Eintrag 'plaintext-root-prod: 35' in plaintext-dockercompose:config.yml
        #   - der Route in /volume1/docker/cloudflared/config.yml (Karte 903)
        #   - der Reaktivierung von Kuma-Monitor 35
        description: 'Was der manuelle Lauf tun soll (root ist stillgelegt: nur ci-only, kein Deploy)'
        type: choice
        options:
          - ci-only
        default: ci-only
  schedule:
    - cron: '0 2 * * *'   # Nightly: schneller Test-Build (ci-only, KEIN Sonar) — gestaffelt, Karte 895
    # Karte 889: gestaffelt. Vorher starteten ALLE SECHS Repos hier zur selben Minute
    # und belegten die vier NAS-Runner komplett; die Analysen bremsten sich dabei
    # gegenseitig (gemessen 86-155 Min statt 23-56 Min allein) und Deploys warteten Stunden.
    - cron: '0 4 * * 2'    # Di 04:00 UTC, Voll-Analyse mit Sonar
  push:
    # Nur master. Ein Zweig mit offenem PR hat vorher ZWEIMAL gefeuert, einmal ueber push
    # und einmal ueber pull_request, mit identischem Ergebnis. Gemessen am 29.08.2026:
    # vier Laeufe auf denselben Commit (Build And Deploy und Playwright je doppelt). Bei
    # vier Runnern ging damit die Haelfte der Kapazitaet fuer Doppelarbeit drauf, und ein
    # Release-Lauf wartete ueber eine Stunde. Die Concurrency-Gruppe half nicht: push und
    # pull_request haben verschiedene refs und damit verschiedene Gruppen.
    # PR-Zweige deckt pull_request ab, master dieser Eintrag.
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  packages: write

concurrency:
  # Karte 890: Analyse und Rollout in GETRENNTE Gruppen. Vorher war es eine Gruppe fuer
  # alles auf einem ref — eine 90-minuetige Sonar-Analyse hielt damit jeden Merge-Deploy
  # auf (Karte 884 wartete 2h40). `inputs` ist hier NICHT verfuegbar (bei schedule/push ist
  # der Kontext leer), deshalb die Unterscheidung am Ereignis: Analysen kommen per
  # schedule, Rollouts per push/workflow_dispatch.
  # Die Ressourcen bleiben unabhaengig davon geschuetzt: die Jobs der Pipeline haben eigene
  # Gruppen (testdb-<project> fuer ci+sonar, deploy-<project> fuer den Deploy) und getrennte
  # Postgres-Ports (DEPLOY_PGPORT = PGPORT + 100). Rollouts bleiben also seriell.
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'analyse' || 'rollout' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Karte 433: Die alte Bedingung prueft die GANZE Commit-Message. Beim Squash-Merge zieht
  # GitHub saemtliche Einzel-Commit-Messages des Branches in den Body — stand in irgendeiner
  # davon "[skip-ci]" (etwa im automatischen Quality-Gate-Commit), wurde der komplette Deploy
  # lautlos uebersprungen: Lauf "skipped", nicht "failed", also ohne rote Markierung. So blieb
  # am 02.08.2026 ein CVE-Fix mit CVSS 9.1 ungerollt.
  #
  # Die Absicht steht in der Betreffzeile, nicht im geerbten Body. Die Ausdruckssprache von
  # GitHub Actions kann Strings nicht zerlegen (kein split, keine Regex, kein Feld nur fuer die
  # Betreffzeile) — deshalb dieser Shell-Schritt, dessen Ergebnis die Bedingung unten liest.
  skip-pruefung:
    runs-on: ['self-hosted', 'nas']
    outputs:
      skip: ${{ steps.pruefung.outputs.skip }}
    steps:
      - id: pruefung
        env:
          # Ueber env, nicht per Interpolation in den Skripttext: eine Commit-Message darf
          # Anfuehrungszeichen und Backticks enthalten.
          MSG: ${{ github.event.head_commit.message }}
          # Karte 886: die Dateilisten des Commits, um Anwendungscode von einer reinen
          # Workflow-/Doku-Aenderung zu unterscheiden. Fehlt das Payload (z.B. bei
          # workflow_dispatch), sind sie leer — dann wird bewusst gemeldet.
          GH_TOKEN: ${{ github.token }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          BETREFF="$(printf '%s' "$MSG" | head -1)"
          if printf '%s' "$BETREFF" | grep -qF '[skip-ci]'; then
            echo "Betreffzeile traegt [skip-ci] — Lauf wird uebersprungen: $BETREFF"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          # Karte 445: Auf master ist ein uebersprungener Lauf optisch nicht von einem
          # erfolgreichen zu unterscheiden — er steht auf "skipped", das Gesamtergebnis auf
          # "success". Genau so blieb der Merge von root#17 unbemerkt: nichts deployt, alles gruen.
          # Gemeldet wird NUR, wenn es kein Automatik-Commit ist. Die beiden Automatik-Muster
          # ("Prepare next development iteration ...", "chore(quality): Quality-Gate-Status ...")
          # setzen den Marker mit Absicht und machen 206 der 214 uebersprungenen master-Laeufe der
          # letzten 100 Laeufe je Repo aus. Wer die mitmeldet, gewoehnt sich die Meldung ab.
          # Lokaler Release (./build 3/5/56/8, plaintext-scripts do_release/do_local_release): der
          # Release-Commit traegt [skip-ci], damit dieser Push nicht parallel zum lokalen Deploy
          # einen zweiten CI-Release startet. Er ist ausgerollt — "laeuft nirgends" waere falsch.
          AUTOMATIK='^(Prepare next development iteration|chore\(quality\): Quality-Gate-Status|Release version)'
          # Karte 886: "laeuft nirgends" stimmt nur fuer Anwendungscode. Eine reine Workflow-
          # oder Doku-Aenderung wirkt ab dem naechsten Lauf, ganz ohne Deploy — und genau die soll
          # laut Rollen-Regel mit [skip-ci] gemergt werden. Wer nach Vorschrift arbeitete, loeste
          # also einen Prioritaets-1-Alarm mit falschem Inhalt aus, und ein Alarm, der regelmaessig
          # nicht stimmt, gewoehnt dem Empfaenger das Hinsehen ab — dieselbe Ueberlegung, aus der
          # oben schon die beiden Automatik-Commits ausgenommen sind.
          #
          # Der Waechter wird praezisiert, nicht abgeschaltet: gemeldet wird weiterhin, nur mit
          # der Dringlichkeit und dem Text, die zutreffen. Alle Zweifelsfaelle (gemischter Commit,
          # fehlendes Payload) gehen in Richtung MELDEN.
          # NACHTRAG 24.08.2026 (Anlass Karte 940): (^|/)src/test/ ergaenzt. Drei Merges an
          # diesem Tag trugen je genau eine neue Testdatei (iot #160, schuetu #192, guild #208)
          # und loesten je einen Prioritaets-1-Alarm "die gemergte Aenderung laeuft nirgends" aus.
          # Auf Testcode trifft der Satz nicht zu: Maven packt src/test/ in KEIN Artefakt, ein
          # Test wird nirgends deployt, er laeuft ab dem naechsten Build mit. Das ist derselbe
          # Fall, fuer den Karte 886 die Abstufung eingefuehrt hat - gemeldet wird weiterhin, nur
          # mit Prioritaet 0 und dem zutreffenden Text.
          #
          # BEWUSST ENG gefasst: nur das Maven-Segment src/test/ (mit Schraegstrich, also NICHT
          # src/testdata/), nicht das Playwright-Verzeichnis e2e/ aus schuetu und nicht die
          # main-Quellen von plaintext-root-archtests - das Modul wird als Jar veroeffentlicht.
          # src/test/ traegt seine Bedeutung vom Build-Werkzeug; ein blosser Verzeichnisname
          # traegt sie nur, solange sich alle daran halten. src/it/ gibt es in der Familie
          # nirgends (nachgezaehlt), deshalb steht es hier nicht: ein Muster fuer etwas, das
          # niemand baut, ist ein ungeprueftes Muster.
          #
          # Gemischte Commits bleiben bei "ja" - grep -qv schaut auf JEDE Zeile, eine einzige
          # Nicht-Test-Datei genuegt. Damit bleibt die Regel von oben gewahrt: Zweifelsfaelle
          # gehen in Richtung MELDEN.
          # ^build$: der Build-Wrapper wird nirgends deployt (kein Bestandteil des Jars) — wie .github/.
          NEUTRAL='^\.github/|(^|/)src/test/|\.md$|^\.gitignore$|^LICENSE$|^renovate\.json$|^build$'
          # NACHGEBESSERT (Karte 886, zweiter Anlauf): zuerst stand hier die Dateiliste aus dem
          # push-Payload (github.event.head_commit.added/modified/removed). Am lebenden System
          # gemessen: nach einem SQUASH-MERGE sind diese Felder leer — vier Merges am 17.08.2026
          # ergaben alle "Anwendungscode=ja", obwohl jeder genau eine Datei unter .github/ aendert.
          # Die Abstufung haette so NIE gegriffen. Der Payload-Weg ist damit widerlegt, nicht nur
          # unsicher; wer ihn wieder einbaut, baut den Fehler nach.
          #
          # Die Commit-API liefert dieselbe Frage korrekt und braucht nur contents:read.
          # Scheitert der Aufruf (Rate-Limit, Netz), bleibt DATEIEN leer und der Fail-safe unten
          # greift: dann wird gemeldet.
          # Der Fail-safe muss im Log SICHTBAR sein: sonst ist "Anwendungscode=ja, weil die API
          # nicht antwortete" nicht von "Anwendungscode=ja, weil wirklich Code drin ist" zu
          # unterscheiden — eine Pruefung, die ihre eigene Luecke verschweigt (Hinweis worker02).
          if ! DATEIEN="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.files[].filename' 2>&1)"; then
            echo "::warning::Commit-API nicht erreichbar — Fail-safe greift, Commit wird als Anwendungscode behandelt. Meldung: $DATEIEN"
            DATEIEN=""
          fi
          ANZAHL="$(printf '%s\n' "$DATEIEN" | sed '/^$/d' | wc -l)"
          # GitHub KUERZT diese Arrays bei sehr grossen Commits. Der leere Fall faellt oben schon
          # auf "ja"; gefaehrlich ist der gekuerzte NICHT-leere: bleiben nach der Kuerzung zufaellig
          # nur .github/-Pfade uebrig, wuerde eine echte Anwendungscode-Aenderung auf prio 0
          # abgestuft — genau die Richtung, die diese Aenderung verhindern soll.
          # Die genaue Kuerzungsgrenze ist hier NICHT gemessen; 50 ist bewusst weit darunter
          # gewaehlt. Ein rein deploy-neutraler Commit mit mehr als 50 Dateien ist ohnehin so
          # ungewoehnlich, dass eine Meldung angemessen ist.
          MAX_VERLAESSLICH=50
          if [ -z "$DATEIEN" ]; then
            ANWENDUNGSCODE=ja
          elif [ "$ANZAHL" -ge "$MAX_VERLAESSLICH" ]; then
            ANWENDUNGSCODE=ja
            echo "Dateiliste umfasst $ANZAHL Eintraege — moeglicherweise gekuerzt, daher als Anwendungscode behandelt."
          elif printf '%s\n' "$DATEIEN" | grep -qvE "$NEUTRAL"; then
            ANWENDUNGSCODE=ja
          else
            ANWENDUNGSCODE=nein
          fi

          if [ "$ANWENDUNGSCODE" = "ja" ]; then
            MELDE_TEXT="Auf master wurde wegen [skip-ci] nicht deployt — die gemergte Aenderung laeuft nirgends. Commit: $BETREFF"
            MELDE_PRIO=1
          else
            MELDE_TEXT="Auf master wurde wegen [skip-ci] nicht deployt. Der Commit beruehrt keinen Anwendungscode — die Aenderung wirkt ab dem naechsten Lauf, ein Deploy war nicht noetig. Commit: $BETREFF"
            MELDE_PRIO=0
          fi

          if [ "$GITHUB_REF_NAME" = "master" ] \
             && printf '%s' "$BETREFF" | grep -qF '[skip-ci]' \
             && ! printf '%s' "$BETREFF" | grep -qE "$AUTOMATIK"; then
            echo "::warning::Deploy auf master uebersprungen (Anwendungscode=$ANWENDUNGSCODE): $BETREFF"
            if [ -n "$PUSHOVER_APP_TOKEN" ] && [ -n "$PUSHOVER_USER_KEY" ]; then
              curl -s -o /dev/null --max-time 20 -X POST https://api.pushover.net/1/messages.json \
                --form-string "token=$PUSHOVER_APP_TOKEN" \
                --form-string "user=$PUSHOVER_USER_KEY" \
                --form-string "title=Deploy uebersprungen: $GITHUB_REPOSITORY" \
                --form-string "message=$MELDE_TEXT" \
                --form-string "priority=$MELDE_PRIO" \
                --form-string "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                --form-string "url_title=Lauf ansehen" \
                || echo "::warning::Pushover-Meldung konnte nicht gesendet werden."
            else
              echo "::warning::Keine Pushover-Zugangsdaten — Meldung nur als Warning im Lauf."
            fi
          fi

  pipeline:
    needs: skip-pruefung
    if: needs.skip-pruefung.outputs.skip != 'true'
    uses: Plaintext-Gmbh/plaintext-scripts/.github/workflows/ci-cd-pipeline.yaml@master
    with:
      # STILLGELEGT am 12.08.2026 auf Anweisung Daniels (Karte 776): der CONTAINER von
      # plaintext-root laeuft nicht mehr, das MAVEN-ARTEFAKT lebt weiter.
      #
      # Deshalb hier `release-only` statt `release-all` — und nicht `ci-only`:
      # plaintext-root-parent ist der Parent-POM von plaintext-app, plaintext-guild,
      # plaintext-schuetu und plaintext-iot; ueber ihn kommt auch die Spring-Boot-Version.
      # Ohne Releases von hier haetten alle vier Anwendungen keinen Weg mehr zu einer neuen
      # root-Version. `release-only` macht Version-Bump, Tag, Push und `mvn clean deploy` in
      # den Reposilite — nur deploy_to_dev/deploy_to_prod bleiben aus.
      #
      # Warum `release-all` nicht einfach stehen bleiben kann: es endet in
      # `sudo docker compose up -d --no-deps --force-recreate <slot>`
      # (plaintext-scripts/tui-build-logic.sh:752). Der Schutz auf dem NAS —
      # `profiles: ["stillgelegt"]` — wirkt nur gegen ein `up -d` OHNE Servicenamen; wird ein
      # Service ausdruecklich genannt, aktiviert Compose sein Profil implizit (gemessen
      # 13.08.2026 auf dem NAS, Docker 29.4.3 / Compose v5.1.3). Ein ganz normaler Merge haette
      # die Stilllegung also aufgehoben.
      #
      # Der Branch-Zweig faellt aus demselben Grund von 'snapshot-dev' auf 'ci-only': auch
      # `snapshot-dev` deployt (deploy_to_dev -> deploy_blue_green "int"), nur eben in die
      # INT-Slots — und die sind genauso stillgelegt wie PROD. Ein Push auf einen
      # Feature-Branch haette also gereicht.
      #
      # WIEDER EINSCHALTEN (zusammen mit den Stilllegungszeilen in
      # /volume1/docker/plaintext-root/docker-compose.yaml): 'release-only' unten wieder durch
      # 'release-all' ersetzen und 'ci-only' im Branch-Zweig durch 'snapshot-dev'. Der manuelle
      # workflow_dispatch bleibt unveraendert — er ist der bewusste, einzelne Rueckweg.
      deploy-target: >-
        ${{ github.event_name == 'schedule' && 'ci-only'
         || github.event_name == 'pull_request' && 'ci-only'
         || github.event_name == 'workflow_dispatch' && github.event.inputs.deploy-target
         || (github.ref == 'refs/heads/master' && 'release-only' || 'ci-only') }}
      project-name: plaintext-root
      database-name: plaintext_root
      # Deploy-Ziele kommen aus Repository-Variablen (Settings -> Variables), damit
      # hier keine umgebungsspezifischen Adressen im oeffentlichen Repo stehen.
      dev-url: ${{ vars.DEPLOY_DEV_URL }}
      prod-url: ${{ vars.DEPLOY_PROD_URL }}
      # Sonar + Voll-Analyse NUR beim WÖCHENTLICHEN Lauf — welcher Tag und welche Stunde das ist,
      # steht im `cron` oben und ist je Repo gestaffelt (Karte 889). Hier absichtlich KEINE Uhrzeit:
      # bis zum 17.08.2026 stand an dieser Stelle "Mo 04:00", und nach der Staffelung war der
      # Kommentar in fünf von sechs Repos falsch. Der tägliche Lauf ('0 3 * * *') bleibt schnell.
      #
      # ACHTUNG, Kosten: ein `workflow_dispatch` ist EBENFALLS ein Voll-Lauf — die Bedingung hängt am
      # github.event_name, NICHT am deploy-target. Auch mit deploy-target=ci-only läuft damit
      # OWASP-CVE und belegt die Gruppe testdb-<repo> bis zu zweieinhalb Stunden (gemessen 17.08.:
      # zwei unbeabsichtigte Blockaden von 2 h). Wer nur einen BUILD braucht, macht einen
      # Branch-Push — der läuft auf GitHub-Runnern und ist in Minuten durch.
      sonar-enabled: ${{ (github.event_name == 'schedule' && !endsWith(github.event.schedule, '* * *')) || github.event_name == 'workflow_dispatch' }}
      quality-analysis: ${{ (github.event_name == 'schedule' && !endsWith(github.event.schedule, '* * *')) || github.event_name == 'workflow_dispatch' }}
      # SICHERHEIT (Karte 426, Entscheidung Daniel 02.08.2026): Pull-Request-Laeufe laufen NICHT
      # mehr auf den self-hosted NAS-Runnern — nur noch master und die Deploys.
      #
      # Grund: Die NAS-Runner haben den Docker-Socket schreibend eingehaengt und laufen als root.
      # Der Socket ist root-aequivalent: wer dort einen Job ausfuehren kann, startet einen
      # Container mit beliebigem Host-Mount und liest JEDE Datei des NAS — auch die .env-Dateien
      # mit Vault-Master-Passwort, Keycloak- und Datenbank-Zugangsdaten. Dieses Repo ist
      # OEFFENTLICH; ein Pull Request war damit ein Weg dorthin. Der Hinweis weiter unten, dass
      # GitHub bei Fork-PRs keine Secrets bereitstellt, schuetzt hier NICHT: wer root auf dem Host
      # ist, braucht keine injizierten Secrets, er liest sie direkt von der Platte.
      #
      # Deploy-Laeufe (master, Feature-Branch-Push, workflow_dispatch) bleiben self-hosted — sie
      # brauchen das Zielnetz, und sie ausloesen kann nur, wer Schreibrecht auf das Repo hat.
      #
      # Auf ubuntu-latest funktioniert die Pipeline unveraendert: sie verbindet sich dort selbst
      # per Twingate ("Connect to Twingate", if: runner.environment != 'self-hosted'), erzeugt
      # ihre settings.xml job-lokal und startet den Test-Postgres per docker run — auf einem
      # Wegwerf-Runner ist der Docker-Zugriff unbedenklich.
      #
      # Der Postgres-Host-Port ist projektspezifisch gewaehlt, damit sich parallele
      # Integrationstest-DBs auf einem geteilten Docker-Daemon nicht in die Quere kommen.
      # Vergeben sind: root 5441, iot 5435, app 5436, schuetu 5437, fwtool 5438, guild 5439.
      #
      # NICHT auf 5434 zurueckstellen (Karte 608, 08.08.2026): Auf dem NAS belegt seit dem
      # Neustart am 08.08. der Postgres der UGREEN-Photo-App 127.0.0.1:5434 dauerhaft
      # (/volume1/@appstore/com.ugreen.photo/db). Der Testcontainer laeuft mit --network host
      # und kann den Port dann nicht binden; `psql` erreicht stattdessen die Photo-Datenbank
      # und meldet Erfolg, sodass der Startschritt gruen aussieht. Erst die Tests fallen mit
      # `FATAL: role "plaintext" does not exist` um — 48 Errors, die wie ein Codefehler wirken.
      runner: >-
        ${{ github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted", "nas"]' }}
      postgres-port: '5441'
    # Karte 717 (aus 313/A10): explizite Liste statt `secrets: inherit`.
    #
    # `inherit` reicht dem Reusable Workflow saemtliche Secrets dieses Repos durch — auch kuenftige,
    # die mit der Pipeline nichts zu tun haben. Der Workflow liegt in `plaintext-scripts`, einem
    # OEFFENTLICHEN Repo, dessen `master` ohne Fremd-Approval aenderbar ist; wer dort committet,
    # fuehrt hier Code aus.
    #
    # **Ehrlich zum heutigen Nutzen:** Dieses Repo besitzt derzeit genau die sieben Secrets, die die
    # Pipeline auch braucht — anders als guild/fwtool/iot/schuetu/app, wo `inherit` zusaetzlich
    # AUTOBUMP_TOKEN durchreichte (dort gemessen: mit `inherit` `vorhanden=true`, mit Liste
    # `false`). Hier wirkt die Aenderung praeventiv: Das naechste Secret, das jemand an dieses Repo
    # haengt, geht nicht mehr automatisch mit.
    #
    # MAVEN_NAS_TOKEN und NVD_API_KEY sind erst seit plaintext-scripts#62 deklariert — ohne das
    # waeren Maven-Deploy und OWASP-Pruefung stumm gebrochen. NVD_API_KEY existiert hier nicht;
    # `inherit` haette es ebenso wenig geliefert.
    #
    # Hinweis: Bei Pull Requests aus Forks stellt GitHub keine Secrets bereit; die Pipeline
    # laeuft dann als reiner Build/Test-Lauf (deploy-target `ci-only`) ohne Deploy.
    secrets:
      TWINGATE_SERVICE_KEY: ${{ secrets.TWINGATE_SERVICE_KEY }}
      MVN_DEPLOY_TOKEN: ${{ secrets.MVN_DEPLOY_TOKEN }}
      MAVEN_NAS_TOKEN: ${{ secrets.MAVEN_NAS_TOKEN }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
