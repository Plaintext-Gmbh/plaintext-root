# ═══════════════════════════════════════════════════════════════════════════════
#  Woodpecker workflow: BROWSER SMOKE (Playwright)
#
#  Corresponds to the job `playwright` from .github/workflows/playwright.yaml. This
#  workflow does NOT hang on the shared pipeline and therefore not on the
#  `ci-motor` guard either — which is why, after the switch to Woodpecker, it kept
#  running on the NAS runner as this repo's only test workflow (documented in the
#  runner logs of 30.08.2026).
#
#  WHAT IT DOES (looked up, not from memory): it starts NO browser
#  against a deployed address. These are TWO JAVA integration tests in
#  plaintext-root-webapp — SelfServicePlaywrightIT (self-registration and
#  password reset) and RootPagesPlaywrightIT (the root/admin pages: menu diagnosis,
#  rootentities, menu entries, mail texts). Both bring up the complete Spring
#  application on a random port and drive it with Chromium.
#  Node and the Playwright NPM world do NOT appear in it; the browser binding
#  is com.microsoft.playwright (Java), version 1.60.0 (plaintext-root-webapp/pom.xml).
#
#  Runs ONLY if `.ci-engine` in the repo root contains the word `woodpecker` —
#  see .woodpecker/waechter.sh and docs/CI.md.
# ═══════════════════════════════════════════════════════════════════════════════

# ── THE IMAGE IS THE WHOLE DECISION HERE ──────────────────────────────────────
# `maven:3.9-eclipse-temurin-25`, the image of all other workflows, has neither a
# browser nor the roughly 40 system libraries Chromium needs (libnss3,
# libgbm1, libasound2t64, ...). Three ways were up for choice:
#
#   1. `maven:3.9-eclipse-temurin-25` + `playwright.CLI install --with-deps chromium`
#      per run — exactly what the GitHub version does (there on `ubuntu-latest`,
#      that is on somebody else's electricity). Costs an `apt-get install`
#      over ~40 packages PLUS a ~150 MB Chromium download on EVERY run. On an
#      agent with WOODPECKER_MAX_WORKFLOWS=2 that is one to three minutes in
#      which half the CI capacity does nothing but download. The
#      cache does not help: the global woodpecker-m2 mount covers /root/.m2, the
#      browsers land in ~/.cache/ms-playwright and die with the container.
#
#   2. `mcr.microsoft.com/playwright:v1.60.0-noble` — has browsers and system packages,
#      but only Node. No JDK, no Maven. Useless for a JAVA test
#      without installing both on top.
#
#   3. Build an image of our own and put it into a registry. Solves the problem,
#      but creates a second one: an artifact that somebody has to build, version and
#      keep up to date at every JDK or Playwright jump.
#
# CHOSEN: `mcr.microsoft.com/playwright/java:v1.60.0-noble`. Microsoft
# publishes the Playwright images per language, and the Java variant is
# exactly way 3, only maintained by Microsoft. Looked up from the image config
# on 30.08.2026 (registry API, not guessed):
#     JAVA_HOME=/usr/lib/jvm/java-25-openjdk-amd64   (apt package openjdk-25-jdk)
#     Maven 3.9.12, linked to /usr/local/bin/mvn
#     PLAYWRIGHT_BROWSERS_PATH=/ms-playwright         (Chromium already unpacked)
# JDK 25 is a condition — the projects build on `release 25`; the Java images of
# the predecessor versions brought older JDKs with them, and that is exactly why the
# tag is pinned instead of `latest`.
#
# THE COUPLING THAT ARISES FROM IT: the image tag MUST be the Playwright version from
# plaintext-root-webapp/pom.xml. The Java library requires exactly the
# Chromium build of its own version; if the image carries a different one, the test
# downloads it at runtime (slow) or falls over. Whoever bumps the dependency bumps
# the tag along with it. The available tags are listed at
# https://mcr.microsoft.com/v2/playwright/java/tags/list

when:
  # AS ON GITHUB, MINUS `push:master`.
  #
  # The GitHub version fires on `pull_request`, on `push:master` and on
  # `workflow_dispatch`. The middle trigger is dropped here, and for
  # the same arithmetic already written down in build.yml: on `master`
  # deploy.yml runs (release + blue-green), and the agent has TWO slots. A
  # browser run of ten to twenty minutes next to the deploy takes half
  # the capacity for a statement that the PR run over the same code has already
  # made. On GitHub that was free, because four runners stood ready.
  #
  # This is a deliberate, named weakening: after a squash merge the
  # state on master is not checked in the browser once more. Whoever wants it
  # back creates a cron in the Woodpecker UI and
  # adds `- event: cron` with its name here — NOT `push:master`.
  - event: pull_request
  # `manual` = the "Run pipeline" button. Without this entry Woodpecker discards
  # the run with "filtered out all steps" (as happened in the schuetu trial run on
  # 30.08.2026). It is the counterpart of GitHub's `workflow_dispatch`.
  - event: manual

# ── WHY SEQUENTIALLY AND NOT IN PARALLEL ──────────────────────────────────────
# Without these lines Woodpecker starts build.yml and this workflow together —
# and occupies both slots of the single agent with ONE pull request. A deploy
# arriving in the same minute then waits for all of it.
# This way build.yml runs first (unit tests, ~10 min), then this one (~10-20 min): one
# slot instead of two, and a browser run is not even started when the
# unit tests are already red.
# A DIFFERENCE FROM GITHUB THAT DESERVES NAMING: there they are two mutually
# independent workflows; a red build did NOT prevent the Playwright run.
# Here it does. So with a red build the UI statement is missing.
depends_on:
  - build

# Full clone with tags — configured identically to build.yml, deploy.yml and the
# two verify workflows. Deliberately identical, so that nobody relies on
# "the other workflow already getting it right".
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0
      tags: true

services:
  # THERE IS MORE HERE THAN IN THE GITHUB VERSION, AND THAT IS THE POINT.
  # .github/workflows/playwright.yaml has NO database for root — the job runs
  # there on `ubuntu-latest`, that is as a NORMAL user, and EmbeddedPg
  # (plaintext-root-webapp, src/test) then starts its embedded server
  # itself. guild and iot already need a Postgres container on their self-hosted
  # runners today, because there `initdb` refuses to run as root
  # (measured 02.08.2026, PR #22).
  #
  # The Woodpecker step likewise runs as root. Without the three
  # SPRING_DATASOURCE_* variables below the run therefore falls over with an
  # initdb message that looks like an environment problem of the agent and is
  # none. Exactly the same rationale is written in build.yml.
  #
  # THROWAWAY TEST DATABASE — not a secret (card 812). It exists only for the
  # duration of this run, is unreachable from outside and holds no real data.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: plaintext_root
      POSTGRES_USER: plaintext
      POSTGRES_PASSWORD: plaintext

steps:
  browser-smoke:
    image: mcr.microsoft.com/playwright/java:v1.60.0-noble
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/plaintext_root
      SPRING_DATASOURCE_USERNAME: plaintext
      SPRING_DATASOURCE_PASSWORD: plaintext
      # Resource guardrail, word for word from build.yml. Here it weighs extra,
      # because besides the Maven JVM and the Surefire fork a Chromium runs in the same
      # container.
      MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAM=4g -XX:ActiveProcessorCount=2"
    commands:
      - . .woodpecker/waechter.sh

      # ── BROWSER GUARD ───────────────────────────────────────────────────────
      # The most important step of this file, and on GitHub it does not exist.
      # Both IT classes catch a failure of Playwright.create() and
      # call Assumptions.assumeTrue(false, "Chromium not installed: ...") — the
      # whole class then SKIPS itself silently, and the run turns GREEN.
      # An image without a browser or an emptied /ms-playwright therefore produces
      # not a red but a green result without a single test. This
      # check turns that around: if the browser is missing, the step aborts here.
      - >-
        bash -c 'if [ -z "$PLAYWRIGHT_BROWSERS_PATH" ]; then
          echo "FEHLER: PLAYWRIGHT_BROWSERS_PATH ist leer." >&2;
          echo "  Erwartet wird das Image mcr.microsoft.com/playwright/java:v<version>-noble," >&2;
          echo "  das die Variable auf /ms-playwright setzt. Steht hier ein anderes Bild," >&2;
          echo "  fehlt der Browser — und die IT-Klasse UEBERSPRINGT sich dann STILL." >&2;
          exit 1;
        fi;
        if ! ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium-* >/dev/null 2>&1; then
          echo "FEHLER: kein Chromium unter $PLAYWRIGHT_BROWSERS_PATH." >&2;
          echo "  Ohne Browser meldet dieser Lauf sonst GRUEN, ohne etwas geprueft zu haben." >&2;
          exit 1;
        fi;
        echo "Chromium gefunden:"; ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium-*;
        java -version; mvn -v | head -1'

      # Wait until Postgres listens. Woodpecker starts services and steps
      # AT THE SAME TIME and knows no `--health-cmd` gate; without this loop
      # the run falls over two minutes later with a PSQLException, and that
      # looks like a test failure. Word for word from build.yml.
      - >-
        bash -c 'for i in $(seq 1 60); do
          (echo > /dev/tcp/postgres/5432) 2>/dev/null && { echo "postgres bereit nach $i Versuchen"; exit 0; };
          sleep 2;
        done;
        echo "FEHLER: Service-Container postgres nach 120 s nicht erreichbar." >&2;
        exit 1'

      # Must run BEFORE the test and is justified the same way on GitHub: it puts the
      # internal modules into the local repository so that the reactor can resolve
      # them during the `-pl plaintext-root-webapp` run.
      # COST, HONESTLY NAMED: this is the same `install` that build.yml has just
      # run shortly before — the two workflows do share /root/.m2
      # (global agent mount, including ~/.m2/build-cache of the
      # maven-build-cache-extension), but not the workspace volume. The
      # build cache absorbs the largest part of it; free it is nevertheless not.
      # The alternative would be to hang the browser test into build.yml as another
      # STEP (steps share the workspace) — but then a UI error colours the
      # build workflow red, and that is exactly what the GitHub version explicitly
      # does not want ("does NOT block merges").
      # Build cache OFF for this step: on a cache hit the webapp module is "restored"
      # from ~/.m2/build-cache — there is then no target/test-classes
      # (PR run #16: "No tests matching pattern ... were executed") and the template
      # facelets unpacked at prepare-package are missing from target/classes (run #14:
      # "Facelet includes/template.xhtml not found", root menu gone). The cache lies in the
      # shared volume woodpecker-m2 and survives runs; the GitHub job does not know it.
      - mvn -B -q -DskipTests -Dmaven.build.cache.enabled=false install

      # Word for word the GitHub step "Run Playwright integration tests".
      # Like the GitHub step, extended by `test-compile`: there the
      # reactor runs without build cache and `install` has built the test classes for sure.
      # Here the maven-build-cache-extension can restore a module from the
      # cache; `test-compile` makes sure that target/test-classes
      # really exists. If failsafe did not find the named classes, the
      # run would still not be silently green — `failIfNoSpecifiedTests` is true by
      # default and lets a `-Dit.test=<name>` that hits nothing turn red.
      # Word for word the GitHub job: ONLY the failsafe goals, NO test-compile before them.
      # With test-compile the lifecycle ran up to compile a second time in PR run #14
      # (30.08.2026) ("Recompiling the module because of changed source code") — after that
      # target/classes/META-INF/resources/includes/template.xhtml was missing (unpacked from
      # plaintext-root-template at prepare-package), and every page with a relative
      # template="includes/…" (index.xhtml among others) ran into "Facelet … not found":
      # root menu gone, three tests red. The preceding `install` has already compiled the
      # test classes (-DskipTests only skips running them), test-compile is superfluous here.
      - >-
        mvn -B -pl plaintext-root-webapp -Dmaven.build.cache.enabled=false
        failsafe:integration-test failsafe:verify
        -Dit.test=SelfServicePlaywrightIT,RootPagesPlaywrightIT

  berichte-bei-fehlschlag:
    image: mcr.microsoft.com/playwright/java:v1.60.0-noble
    # Substitute for `actions/upload-artifact` with `if: failure()`. Woodpecker has
    # no artifact storage — the reports therefore go into the step log instead of
    # a download. That is the honest substitute, not an equivalent feature
    # (see docs/CI.md, "When something is red").
    #
    # SINCE CARD 1018 THIS IS NO LONGER THE ONLY VIEW, but it is still the only one
    # for THIS workflow: `build.yml` has a `testbericht` step that turns its JUnit XML
    # into a clickable Allure report (docs/CI.md, "Test reports"). build.yml and
    # playwright.yml do not share a workspace, so that report does not contain the
    # browser tests. Two warnings if anyone wants to change that:
    #   * the .txt files below LIE about @Nested classes ("Tests run: 0"); the numbers
    #     live in the XML of the same directory. Anything new reads the XML.
    #   * this step is `status: [failure]`; the Allure step is [success, failure],
    #     because a report that only appears when things break has no trend to compare.
    when:
      - status: [failure]
    commands:
      - . .woodpecker/waechter.sh
      - >-
        bash -c 'gefunden=0;
        for f in plaintext-root-webapp/target/failsafe-reports/*.txt plaintext-root-webapp/target/surefire-reports/*.txt; do
          [ -f "$f" ] || continue;
          gefunden=1;
          echo "──────── $f ────────";
          cat "$f";
        done;
        [ "$gefunden" = "1" ] || echo "Keine Testberichte vorhanden — der Lauf ist vor den Tests abgebrochen."'
