# ═══════════════════════════════════════════════════════════════════════════════
#  Woodpecker workflow 3 of 3: SONARQUBE ANALYSIS
#
#  Corresponds to the job `sonar` from the shared GitHub pipeline — BUT ONLY IN PART.
#
#  ┌───────────────────────────────────────────────────────────────────────────┐
#  │ NOT PORTED: the weekly FULL analysis (`quality-analysis`), that is        │
#  │ OWASP CVE, SpotBugs, the quality gate evaluation and the write-back of    │
#  │ quality/quality-gate.properties.                                          │
#  └───────────────────────────────────────────────────────────────────────────┘
#
#  That is a deliberate omission, not forgetfulness. The CVE scan needs a
#  PERSISTENT NVD data set. On the GitHub runners it lives in a named
#  volume (odc-cache, since card 914) under $HOME/.cache/owasp-dc-data. The Woodpecker
#  agent mounts ONLY `woodpecker-m2:/root/.m2` into step containers; everything else is
#  gone with the container, and an untrusted repo may not mount a volume for itself.
#
#  Without that data set, dependency-check downloads the complete NVD on EVERY run.
#  Measured (card 896/897, without NVD_API_KEY): around 96 minutes, which regularly run
#  into the timeout — and then NO report is produced, and quality-gate.py explicitly
#  counts a missing report as "no breach". The result would be a green gate because
#  NOTHING WAS MEASURED. The GitHub pipeline learned exactly this state expensively over
#  months (cards 365, 420, 896, 925) — plaintext-root was one of the repos whose gate
#  therefore wrongly stood at OK for weeks. Rebuilding it here would be worse than the gap.
#
#  On top of that comes the capacity price: the agent runs WOODPECKER_MAX_WORKFLOWS=2. A
#  two-hour OWASP step occupies HALF of the entire CI capacity of the NAS.
#
#  THIS WEIGHS ESPECIALLY HEAVILY IN ROOT: root is the parent POM of app, guild, iot and
#  schuetu, and most CVEs of the family arrive via its <dependencyManagement>. A CVE scan
#  that fails here fails for all four consumers. As long as `.ci-engine` says
#  `woodpecker`, the dependency check of this family must therefore be covered some other
#  way (Renovate keeps running; it reports new versions, not CVEs).
#
#  PREREQUISITES for closing the gap (repeated in docs/ci/WOODPECKER_SETUP.md):
#    1. A second global volume on the agent:
#         WOODPECKER_BACKEND_DOCKER_VOLUMES=woodpecker-m2:/root/.m2,woodpecker-odc:/root/.cache/owasp-dc-data
#    2. python3 and jq in the step image (for quality/quality-gate.py).
#    3. Ideally NVD_API_KEY as a secret — then the scan time drops from ~96 minutes to a
#       few, and the capacity objection disappears with it.
#
#  The ci-motor guard locks the full analysis out on the GitHub side as well — deliberately,
#  because an exception from that would mean two systems committing
#  quality/quality-gate.properties back at the same time.
# ═══════════════════════════════════════════════════════════════════════════════

when:
  # Weekly full analysis. The cron is created in the Woodpecker UI
  # (Repo -> Settings -> Crons); `cron:` filters on its NAME. So a cron
  # named `wochenanalyse` must exist, otherwise this branch never runs. On the GitHub side
  # it is Tuesday for root ('0 4 * * 2') — the staggering across the repos comes from
  # card 889 and should be preserved when the cron is created.
  - event: cron
    cron: wochenanalyse
  # Like `workflow_dispatch` on the GitHub side: a manual run is a full run there TOO
  # (sonar-enabled depends on the event, not on the deploy target). The comment there
  # warns explicitly about the cost — here it counts double, see capacity above.
  - event: manual

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      # fetch-depth: 0 as on the GitHub side — with -Dsonar.scm.provider=git the
      # scanner evaluates the git history (blame for "new code").
      partial: false
      depth: 0
      tags: true

services:
  # Mandatory, not comfort: EmbeddedPg starts a server of its own only without
  # SPRING_DATASOURCE_URL, and `initdb` refuses to run as root (card 451 / PR #22).
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: plaintext_root
      POSTGRES_USER: plaintext
      POSTGRES_PASSWORD: plaintext

steps:
  sonarqube:
    image: maven:3.9-eclipse-temurin-25
    # A run without build cache takes around 25 minutes (measured on all four projects);
    # with 24 modules root is the biggest of them. Woodpecker knows no step timeout in the
    # YAML; the time limit is a REPO setting in the UI (Settings -> Timeout,
    # default 60 minutes). Without raising it a cold run is cut off there. That is the
    # counterpart of `timeout-minutes` — it just does not stand here.
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/plaintext_root
      SPRING_DATASOURCE_USERNAME: plaintext
      SPRING_DATASOURCE_PASSWORD: plaintext
      MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAM=4g -XX:ActiveProcessorCount=2"
      SONAR_HOST_URL: https://sonarqube.plaintext.ch
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - . .woodpecker/waechter.sh
      - >-
        bash -c 'for i in $(seq 1 60); do
          (echo > /dev/tcp/postgres/5432) 2>/dev/null && { echo "postgres bereit nach $i Versuchen"; exit 0; };
          sleep 2;
        done;
        echo "FEHLER: Service-Container postgres nicht erreichbar." >&2;
        exit 1'
      # From here on character for character the step "SonarQube Analysis" of the GitHub pipeline.
      # -Dmaven.build.cache.enabled=false is MANDATORY: with an active build cache Maven
      # restores the modules from the cache instead of compiling them, then there are no
      # target/classes on disk and the scanner aborts with "Your project contains
      # .java files, please provide compiled classes with sonar.java.binaries property"
      # (card 365). The run becomes considerably longer as a result — that is the price for
      # it measuring anything at all.
      # -Pcoverage,fast is historical (neither profile exists in any project any more, Maven
      # acknowledges that with a WARNING) and stays because '-P' without the names could
      # switch off an activeByDefault profile. In root that would not be merely theoretical:
      # dual-publish-nas hangs on a property, not on activeByDefault, but the next
      # person who cleans up '-P' here should have looked that up.
      - >-
        GROUP_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout);
        ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout);
        PROJECT_KEY="$GROUP_ID:$ARTIFACT_ID";
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout);
        mvn clean verify sonar:sonar -B -DskipITs -DexcludedGroups=quality-gate -Pcoverage,fast
        -Dmaven.build.cache.enabled=false
        -Dsonar.projectKey="$PROJECT_KEY"
        -Dsonar.projectName="plaintext-root"
        -Dsonar.projectVersion="$VERSION"
        -Dsonar.host.url="$SONAR_HOST_URL"
        -Dsonar.token="$SONAR_TOKEN"
        -Dsonar.java.source=25
        -Dsonar.java.target=25
        -Dsonar.scm.provider=git;
        echo "Dashboard: $SONAR_HOST_URL/dashboard?id=$PROJECT_KEY"

  meldung-bei-analyse-ausfall:
    image: maven:3.9-eclipse-temurin-25
    when:
      - status: [failure]
    environment:
      PUSHOVER_APP_TOKEN:
        from_secret: pushover_app_token
      PUSHOVER_USER_KEY:
        from_secret: pushover_user_key
    commands:
      - . .woodpecker/waechter.sh
      # Without this notification an analysis failure stays invisible: the quality gate keeps
      # its last state, and an old "OK" cannot be told apart from a current
      # one. That is exactly how the gates of root/schuetu/iot stood at OK for weeks
      # although no analysis had run through since 20.07.2026 (card 365).
      - >-
        if [ -z "$PUSHOVER_APP_TOKEN" ] || [ -z "$PUSHOVER_USER_KEY" ]; then
          echo "Keine Pushover-Zugangsdaten — Meldung nur hier im Log.";
          exit 0;
        fi;
        curl -s -o /dev/null --max-time 20 -X POST https://api.pushover.net/1/messages.json
        --form-string "token=$PUSHOVER_APP_TOKEN"
        --form-string "user=$PUSHOVER_USER_KEY"
        --form-string "title=Sonar-Analyse fehlgeschlagen: plaintext-root (Woodpecker)"
        --form-string "message=Die Analyse lief NICHT durch — das Quality-Gate zeigt weiterhin seinen alten Stand. Ein dort sichtbares OK ist damit nicht aussagekraeftig. root ist der Parent-POM von app, guild, iot und schuetu."
        --form-string "priority=1"
        --form-string "url=$CI_PIPELINE_URL"
        --form-string "url_title=Lauf ansehen"
        || echo "Pushover-Meldung konnte nicht gesendet werden."
