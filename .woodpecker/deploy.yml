# ═══════════════════════════════════════════════════════════════════════════════
#  Woodpecker workflow 2 of 3: RELEASE (Maven artifact) — WITHOUT container deploy
#
#  Corresponds to the job `deploy` from
#  Plaintext-Gmbh/plaintext-scripts/.github/workflows/ci-cd-pipeline.yaml.
#
#  ┌───────────────────────────────────────────────────────────────────────────┐
#  │ ROOT IS NOT AN APPLICATION, IT IS THE FRAMEWORK.                          │
#  │ Its deploy target on master is `release-only`, not `release-all`:         │
#  │ version bump, tag, push, `mvn clean deploy`. NO blue-green, NO            │
#  │ container. The root container on the NAS has been decommissioned          │
#  │ since 12.08.2026 (card 776); the MAVEN ARTIFACT lives on, because         │
#  │ plaintext-root-parent is the parent POM of app, guild, iot and schuetu.   │
#  └───────────────────────────────────────────────────────────────────────────┘
#
#  THE RELEASE LOGIC IS NOT PORTED AND DOES NOT NEED TO BE. It lives in
#  plaintext-scripts/tui-build-logic.sh (do_release) and in the local ./build. This
#  workflow only provides the environment in which `./build` runs exactly as it does on a
#  NAS runner: JDK + Maven, settings.xml with BOTH server IDs, gh, SSH key,
#  plaintext-scripts and plaintext-config under $HOME/codeplain, a test database for
#  the unit tests of the release build.
#
#  The ./build call below is taken over CHARACTER FOR CHARACTER from the GitHub pipeline
#  (`release-only` -> `./build release`). Whoever fiddles with it fiddles with the
#  release number arithmetic, with the tag and with the publication.
#
#  ── WHAT A ROOT RELEASE PUBLISHES: THREE TARGETS, ONE ORDER ─────────────────────
#  1. GitHub Packages   — <distributionManagement>, server-id `plaintext`
#                         (https://maven.pkg.github.com/Plaintext-Gmbh/plaintext-mvn)
#  2. Reposilite (NAS)  — profile `dual-publish-nas`, server-id `plaintext-nas`,
#                         altDeploymentRepository https://maven.plaintext.ch/releases.
#                         It is activated NOT by the pipeline but by
#                         .mvn/maven.config (-Droot.dual.publish=true) — which is why it
#                         applies to both CI engines alike, and why there is no `-P` here.
#  3. Plaintext-Gmbh/plaintext-mvn — the git-based mirror that ./build itself triggers
#                         after a successful `release` (mirror_to_plaintext_mvn,
#                         which lives in root's ./build and NOT in plaintext-scripts).
#                         Needs GITHUB_TOKEN; if it fails, the release stays valid.
#
#  NO `deployAtEnd`, AND NEVER AGAIN. The attempt of 29.08.2026 (release 1.636.0)
#  is recorded in pom.xml:620: the deploy plugin runs TWO executions here
#  (default -> GitHub Packages, deploy-nas -> Reposilite), and with deployAtEnd that ended
#  in a 409 from the Reposilite and half a release. The order stays as it is.
#
#  Runs ONLY if `.ci-engine` contains the word `woodpecker` (waechter.sh).
# ═══════════════════════════════════════════════════════════════════════════════

when:
  - event: push
    branch: master
  - event: manual

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      # MANDATORILY FULL AND WITH TAGS — here, unlike in build.yml, not cosmetic:
      #   * init_versions() reads the last release number from `git describe --tags`;
      #     a shallow clone without tags yields 0.0.0 and the next version would be wrong.
      #   * do_release() compares HEAD with origin/master and pushes release commit AND tag
      #     BEFORE anything at all is published (card 518).
      #   * mirror_to_plaintext_mvn() takes the version from `git describe --tags`, not from
      #     the POM — by that time it already points at the next SNAPSHOT.
      partial: false
      depth: 0
      tags: true

services:
  # A test database of its own for the unit tests that run along in the release build (M1:
  # the deploy job is the ONLY build). In the GitHub pipeline the container is called
  # `ci-postgres-deploy-5541` (root port 5441 + 100) and needs that per-project
  # reserved port so that two repos on the same Docker daemon do not collide.
  # Not here: the service hangs on THIS workflow's network and is invisible from outside.
  #
  # AND IT IS MANDATORY, not comfort: EmbeddedPg in plaintext-root-webapp only starts
  # an embedded server when SPRING_DATASOURCE_URL is missing — and `initdb` refuses
  # to run as root, which is what the step container is (card 451 / PR #22).
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: plaintext_root
      POSTGRES_USER: plaintext
      POSTGRES_PASSWORD: plaintext

steps:
  release:
    image: maven:3.9-eclipse-temurin-25
    environment:
      # ── THE MOST IMPORTANT LINE OF THIS FILE ───────────────────────────────────
      # Woodpecker sets CI=woodpecker on its own. tui-build-logic.sh, however, checks in
      # several places for the VALUE "true", not for "is set":
      #     if [ "${CI:-}" != "true" ]; then lokal_vorflug; fi
      # Without this override the PREFLIGHT OF THE LOCAL RELEASE would run along — it
      # checks the working tree, asks `gh` about running GitHub Actions runs
      # ("CI lock") and aborts. A release that fails on that looks like a
      # network problem. The same variable also selects, in tui-build-logic.sh line 33,
      # `docker` as container runtime — see step 1.
      CI: "true"
      # The default value for `push` on master. Corresponds to the deploy-target expression
      # in the caller (.github/workflows/ci-cd.yaml): `github.ref == 'refs/heads/master' &&
      # 'release-only'`. Manual runs override it below — bounded by the allowlist.
      DEPLOY_TARGET: release-only
      # Without this, git waits for an input that never comes when credentials are missing —
      # a clear failure would turn into a run that hangs until the repo timeout.
      GIT_TERMINAL_PROMPT: "0"
      # server-id `plaintext` (GitHub Packages) AND push of release commit and tag.
      MVN_DEPLOY_TOKEN:
        from_secret: mvn_deploy_token
      # `mvn deploy` into the Reposilite (maven.plaintext.ch) needs the server-id
      # `plaintext-nas` from the dual-publish-nas profile; the token lives in settings.xml.
      MAVEN_NAS_TOKEN:
        from_secret: maven_nas_token
      SSH_PRIVATE_KEY:
        from_secret: ssh_private_key
      # THE SAME VALUE AS MVN_DEPLOY_TOKEN, word for word as in the GitHub pipeline
      # (GITHUB_TOKEN from secrets.MVN_DEPLOY_TOKEN at the Build & Deploy step).
      # Two things in root depend on it, and both are silent when it is missing:
      #   * mirror_to_plaintext_mvn (./build) — without a token: "kein GITHUB_TOKEN -
      #     Spiegelung uebersprungen", return 0. The git-based way of obtaining it,
      #     described in plaintext-mvn's README, would stay unfilled, and nobody would see it.
      #   * release_notes_erzeugen (tui-build-logic.sh) — creates the GitHub release for
      #     the tag just pushed. It exists for every root release (checked
      #     30.08.2026: 1.643.0 through 1.647.0 all present).
      GITHUB_TOKEN:
        from_secret: mvn_deploy_token
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/plaintext_root
      SPRING_DATASOURCE_USERNAME: plaintext
      SPRING_DATASOURCE_PASSWORD: plaintext
      MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAM=4g -XX:ActiveProcessorCount=2"
      # The release run is ONE step, not several. That is not convenience but
      # Woodpecker's model: every step is a container of its own, and the ONLY thing
      # shared is the workspace volume. $HOME/codeplain, ~/.ssh and /tmp of one step
      # no longer exist for the next step. The GitHub pipeline can spread this
      # over eight steps, because there all steps run in the same runner
      # container. Splitting it up here would be a replica without benefit.
    commands:
      - . .woodpecker/waechter.sh

      # ── 0. What is this run supposed to do? ────────────────────────────────────
      # In Woodpecker there are no typed inputs; a manual run instead passes the
      # variable  deploy_target=<target>  in the "Run pipeline" dialog.
      # Without it a manual run does NOTHING — the safe direction.
      #
      # THE ALLOWLIST IS THE SUBSTITUTE FOR A DELETED SELECTION OPTION. In the GitHub UI
      # (.github/workflows/ci-cd.yaml) `release-all` has DELIBERATELY not been selectable
      # since card 904, because it ends in
      #     sudo docker compose up -d --no-deps --force-recreate <slot>
      # and `profiles: ["stillgelegt"]` does NOT take effect as soon as a service is
      # started by name (measured 13.08.2026 on the NAS). That is exactly how the
      # decommissioning was accidentally undone on 17.08.2026. A comment alone did not
      # prevent it back then — in the dialog you only see the options.
      # Woodpecker's dialog has no selection list, only a text field. The
      # limitation must therefore stand HERE, and be loud.
      - >-
        if [ "$CI_PIPELINE_EVENT" = "manual" ]; then
          DEPLOY_TARGET="${deploy_target:-ci-only}";
        fi;
        echo "DEPLOY_TARGET=$DEPLOY_TARGET (Ereignis: $CI_PIPELINE_EVENT)";
        case "$DEPLOY_TARGET" in
          ci-only)
            echo "ci-only — dieser Workflow veroeffentlicht nichts. Fuer ein Release im";
            echo "'Run pipeline'-Dialog die Variable deploy_target=release-only setzen.";
            exit 0
            ;;
          release-only)
            :
            ;;
          *)
            echo "FEHLER: deploy_target='$DEPLOY_TARGET' ist fuer plaintext-root gesperrt." >&2;
            echo "  Erlaubt sind NUR 'ci-only' und 'release-only'." >&2;
            echo "  Alle anderen Ziele deployen Container — und der root-Container ist seit" >&2;
            echo "  dem 12.08.2026 stillgelegt (Karte 776). 'profiles: [stillgelegt]' auf dem" >&2;
            echo "  NAS schuetzt NICHT davor: Compose aktiviert das Profil implizit, sobald" >&2;
            echo "  ein Service namentlich gestartet wird. Genau so wurde die Stilllegung am" >&2;
            echo "  17.08.2026 versehentlich aufgehoben." >&2;
            echo "  Beim Wiederanschalten: die Liste in .github/workflows/ci-cd.yaml und diese" >&2;
            echo "  Allowlist gemeinsam erweitern, sonst weichen die beiden Motoren ab." >&2;
            exit 1
            ;;
        esac;
        echo "$DEPLOY_TARGET" > /tmp/deploy-target

      # ── 1. Retrofit the tools ──────────────────────────────────────────────────
      # maven:3.9-eclipse-temurin-25 already brings git, ssh, scp, curl, tar and Maven
      # 3.9.16. Two binaries are missing, and they carry very different weight:
      #
      # (a) docker — MANDATORY, hence without a safety net. It is NOT needed for building:
      #     plaintext-root carries `.m3-jar-volume`, so it calls neither `docker build` nor
      #     `docker save`, and with release-only no container is touched anyway.
      #     It is needed solely because tui-build-logic.sh looks for a container runtime
      #     while being SOURCED and does `exit 1` if it finds none (line 33 ff.) — `./build`
      #     would therefore die before doing anything at all. A stub would be dangerous: in
      #     a repo without `.m3-jar-volume` the image build would silently do nothing
      #     instead of failing loudly.
      #
      # THIS IS THE STOPGAP SOLUTION. A release should not hang on a download from
      # download.docker.com. The permanent one is in docs/ci/WOODPECKER_SETUP.md: a step image
      # of our own with docker-cli and gh already inside; then this
      # block disappears entirely and only the `image:` line changes.
      - >-
        DOCKER_CLI_VERSION=28.1.1;
        curl -fsSL --retry 3 --retry-delay 5
        "https://download.docker.com/linux/static/stable/x86_64/docker-$DOCKER_CLI_VERSION.tgz"
        | tar -xz -C /usr/local/bin --strip-components=1 docker/docker
      - docker --version

      # (b) gh — BEST EFFORT, hence with a safety net. release_notes_erzeugen()
      #     (tui-build-logic.sh) creates a GitHub release with generated notes for the
      #     tag just pushed; if `gh` is missing, the function bails out with a yellow
      #     warning and returns 0 — tag and artifacts are untouched, but the release
      #     is missing silently. On the NAS runners gh is in the runner image, here it is
      #     not; without this block the engine switch would be a silent loss of function.
      #     iot/app/guild/schuetu do not have this — there the GitHub release is a trimming,
      #     in root the publication is the entire product of the run.
      #     Version hard-wired instead of "latest": a release run should not depend on
      #     what api.github.com calls the newest version tonight.
      - >-
        if curl -fsSL --retry 3 --retry-delay 5
        "https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz"
        | tar -xz -C /usr/local/bin --strip-components=2 --wildcards '*/bin/gh'; then
          gh --version;
        else
          echo "WARNUNG: gh liess sich nicht installieren. Das Release laeuft trotzdem;";
          echo "  nur das GitHub-Release mit Notes entfaellt. Nachholen von Hand:";
          echo "  gh release create <version> -R Plaintext-Gmbh/plaintext-root --generate-notes";
        fi

      # ── 2. Git: identity, branch, push access ──────────────────────────────────
      # Depending on the event, Woodpecker's clone plugin leaves the working tree on a
      # detached HEAD and deposits NO push credentials a normal step could read
      # (CI_NETRC_* go only to trusted repos and plugins). Both are established here
      # explicitly instead of relying on the plugin: `do_release` does a
      # `git push` on the branch and `git push origin refs/tags/<version>`, and both BEFORE
      # the publication.
      #
      # ORDER: the credentials come BEFORE the first network access. plaintext-root is
      # a PUBLIC repo — unlike iot — but `git fetch` is not the only network access
      # here: plaintext-config is private, and the clone further down
      # fails without the helper.
      #
      # The token arrives through a credential helper in /tmp, NOT as
      # `https://token@github.com/...` in a remote URL: `do_release` calls `git add -A`,
      # and everything lying in the repo directory ends up in the release commit. The rule
      # "no secret in the repo directory" holds here without exception — it is also the
      # reason why the settings.xml below lives in /tmp. `--global` (that is /root/.gitconfig,
      # the write layer of this container), so that the two clones further down manage
      # without a token in the URL.
      - mkdir -p /tmp/ci && chmod 700 /tmp/ci
      - >-
        umask 077;
        printf 'https://x-access-token:%s@github.com\n' "$MVN_DEPLOY_TOKEN" > /tmp/ci/.git-credentials
      - git config --global credential.helper "store --file=/tmp/ci/.git-credentials"
      - git config --global user.email "woodpecker@plaintext.ch"
      - git config --global user.name "WoodpeckerCI"
      - git remote set-url origin "https://github.com/$CI_REPO.git"
      - git fetch --tags --force origin
      - git checkout -B "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA"
      - git branch --set-upstream-to="origin/$CI_COMMIT_BRANCH" "$CI_COMMIT_BRANCH"

      # ── 3. Maven credentials: BOTH server IDs ──────────────────────────────────
      # Character for character the settings.xml of the GitHub pipeline. root is the only
      # repo that really needs BOTH entries:
      #   * `plaintext`      -> GitHub Packages (<distributionManagement>)
      #   * `plaintext-nas`  -> Reposilite (profile dual-publish-nas, altDeploymentRepository)
      # If one is missing, `mvn deploy` fails AFTER tag and push — the tag would then be out
      # and the artifact half done. Exactly that case happened in plaintext-app on 29.08.2026
      # (2.1709.0: tag without artifact, 401 from the Reposilite).
      #
      # NOT into ~/.m2/settings.xml. /root/.m2 is the volume `woodpecker-m2`, which the agent
      # mounts into EVERY step container of EVERY repo — the same trap as card 313 on the
      # GitHub runners, where a shared m2 volume passed the tokens in clear text on to
      # foreign repos. /tmp lies in the write layer of this one container.
      #
      # NO mvn shim as in the GitHub pipeline: the shim exists there because the
      # twingate runners once carried Maven 3.6.3, which does not evaluate MAVEN_ARGS. This
      # image is pinned to 3.9.16, so MAVEN_ARGS takes effect — also for the mvn calls
      # inside ./build and mirror_to_plaintext_mvn, without touching a single call
      # site.
      - >-
        umask 077;
        printf '%s\n'
        '<settings>'
        '  <servers>'
        '    <server><id>plaintext</id><username>daniel-marthaler</username><password>'"$MVN_DEPLOY_TOKEN"'</password></server>'
        '    <server><id>plaintext-nas</id><username>ci</username><password>'"$MAVEN_NAS_TOKEN"'</password></server>'
        '  </servers>'
        '</settings>' > /tmp/ci/settings.xml
      - chmod 600 /tmp/ci/settings.xml
      # Clear away an old file in the SHARED volume: it would not override MAVEN_ARGS,
      # but would still lie there readable for every other repo.
      - rm -f /root/.m2/settings.xml
      - export MAVEN_ARGS="-s /tmp/ci/settings.xml"

      # ── 4. SSH to the NAS ──────────────────────────────────────────────────────
      # YES, WITH release-only TOO. This is the point where "root doesn't deploy anything"
      # is misleading: plaintext-root carries `.m3-jar-volume`, so
      # tui-build-logic.sh sets JAR_VOLUME_DEPLOY=true, and after the
      # `mvn deploy` do_release unconditionally calls stage_jar_to_nas() — SSH to
      # mad@192.168.1.224, deploy lock, jar to DEPLOY_PATH/jars/staging. Only
      # deploy_to_dev/deploy_to_prod are skipped with release-only, the staging is not.
      # Without a key the run aborts AFTER the publication: artifacts out, run red.
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - umask 077; printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa
      - ssh-keyscan -H 192.168.1.224 >> ~/.ssh/known_hosts 2>/dev/null || true
      - ssh-keyscan -H 192.168.0.7   >> ~/.ssh/known_hosts 2>/dev/null || true

      # ── 5. plaintext-scripts and plaintext-config ──────────────────────────────
      # `./build` looks for the library at the fixed path $HOME/codeplain/plaintext-scripts,
      # and load_build_conf() looks for the project configuration under
      # $HOME/codeplain/plaintext-config/<basename of the project directory>.
      #
      # CAREFUL, SILENT TRAP: the <basename> is the directory name of the checkout. It MUST
      # read `plaintext-root`, otherwise load_build_conf falls back to a non-existent local
      # build-conf.txt and ./build aborts with "build-conf.txt not found". That file supplies,
      # among other things, MVN_RELEASE_DEPLOY=true — that is, the difference between
      # `mvn clean deploy` and `mvn clean package`. Missing it would mean: green run,
      # nothing published.
      # Woodpecker's default workspace ends in .../Plaintext-Gmbh/plaintext-root, so it fits —
      # but only as long as nobody changes `workspace:`. That is why it is checked below.
      - mkdir -p "$HOME/codeplain"
      - git clone --depth 1 https://github.com/Plaintext-Gmbh/plaintext-scripts.git "$HOME/codeplain/plaintext-scripts"
      - git clone --depth 1 https://github.com/Plaintext-Gmbh/plaintext-config.git  "$HOME/codeplain/plaintext-config"
      - chmod +x "$HOME/codeplain/plaintext-scripts"/*.sh
      - >-
        if [ "$(basename "$PWD")" != "plaintext-root" ]; then
          echo "FEHLER: Arbeitsverzeichnis heisst '$(basename "$PWD")', nicht 'plaintext-root'." >&2;
          echo "  load_build_conf() leitet daraus den Namen der Konfiguration ab" >&2;
          echo "  (plaintext-config/<name>/build-conf.txt). ./build wuerde gleich mit" >&2;
          echo "  'build-conf.txt not found' abbrechen. workspace:-Einstellung pruefen." >&2;
          exit 1;
        fi

      # ── 6. Waiting for the test database ───────────────────────────────────────
      - >-
        bash -c 'for i in $(seq 1 60); do
          (echo > /dev/tcp/postgres/5432) 2>/dev/null && { echo "postgres bereit nach $i Versuchen"; exit 0; };
          sleep 2;
        done;
        echo "FEHLER: Service-Container postgres nicht erreichbar — der Release-Build" >&2;
        echo "  fuehrt die Unit-Tests mit und braucht ihn (M1: build once)." >&2;
        exit 1'

      # ── 7. Release ─────────────────────────────────────────────────────────────
      # From here on CHARACTER FOR CHARACTER the step "Build & Deploy" of the GitHub pipeline.
      # MVN_TEST_FLAG: unit tests run along in the ONLY build (ITs separately). The marker
      # [fast] in the commit subject line skips ALL tests. -DexcludedGroups=quality-gate:
      # the gate guard must not block the RELEASE (a hotfix has to get out despite a red gate).
      #
      # The four remaining case branches are here so that the file stays comparable with the
      # GitHub pipeline line by line. None of them is reachable: the allowlist
      # in step 0 lets only release-only through.
      - >-
        case "$CI_COMMIT_MESSAGE" in
          *"[fast]"*) export MVN_TEST_FLAG="-DskipTests" ;;
          *)          export MVN_TEST_FLAG="-DskipITs -DexcludedGroups=quality-gate" ;;
        esac;
        echo "MVN_TEST_FLAG=$MVN_TEST_FLAG";
        chmod +x ./build;
        DEPLOY_TARGET="$(cat /tmp/deploy-target)";
        case "$DEPLOY_TARGET" in
          snapshot-dev)
            echo "=== Snapshot Build + Deploy DEV ===";
            ./build build deploy
            ;;
          release-dev)
            echo "=== Release + Deploy DEV ===";
            ./build release deploy-healthcheck
            ;;
          release-all)
            echo "=== Release + Deploy DEV + PROD ===";
            ./build 56
            ;;
          release-only)
            echo "=== Release (Maven-Artefakt) OHNE Container-Deploy ===";
            ./build release
            ;;
          prod-single)
            echo "=== Single PROD instance (kein blue-green, kein DEV) ===";
            ./build build prod-single
            ;;
          *)
            echo "Unknown deploy target: $DEPLOY_TARGET";
            exit 1
            ;;
        esac

  aufraeumen:
    image: maven:3.9-eclipse-temurin-25
    when:
      - status: [success, failure]
    commands:
      # The step container is about to vanish anyway — this step clears what is NOT vanishing:
      # the shared volume woodpecker-m2, which the agent mounts into every step of every repo.
      # A settings.xml left behind there would be readable for every foreign run (card 313).
      # A step of its own, because a `status:` filter exists only at step level; it runs in a
      # new container and therefore sees neither /tmp/ci nor ~/.ssh of the release step.
      - 'rm -f /root/.m2/settings.xml && echo "Geteiltes Volume geprueft: kein settings.xml in /root/.m2."'
