# ═══════════════════════════════════════════════════════════════════════════════
#  Woodpecker workflow 1 of 3: BUILD & TEST
#
#  Corresponds to the job `ci` ("Build & Test") from
#  Plaintext-Gmbh/plaintext-scripts/.github/workflows/ci-cd-pipeline.yaml.
#
#  Runs ONLY if `.ci-engine` in the repo root contains the word `woodpecker` —
#  see .woodpecker/waechter.sh and docs/CI.md.
#
#  THREE workflows, not four as in iot/app/guild/schuetu: `verify-dev.yml` and
#  `verify-prod.yml` are deliberately absent here. Rationale in docs/CI.md,
#  section "Was root anders macht" — in short: root runs `release-only`, and the
#  GitHub pipeline skips both verify jobs for exactly that reason
#  (`inputs.deploy-target != 'release-only'` resp. `== 'release-all'`).
# ═══════════════════════════════════════════════════════════════════════════════

when:
  # NO `push` on master. That is deliberate and the counterpart of M1 ("build once"):
  # on master the DEPLOY workflow (deploy.yml) builds, and it runs the unit tests
  # itself via MVN_TEST_FLAG=-DskipITs. The GitHub pipeline expresses this with
  # `if: inputs.deploy-target == 'ci-only' || inputs.sonar-enabled` on the ci job — on
  # a release-only run it is skipped. Whoever adds `push: master` here
  # builds every merge twice and, with WOODPECKER_MAX_WORKFLOWS=2, ties up half the
  # capacity of the single agent with duplicated work.
  - event: pull_request
  # `manual` = the "Run pipeline" button in the Woodpecker UI. Without this entry
  # Woodpecker discards the run with "filtered out all steps" (as happened in the
  # schuetu trial run on 30.08.2026).
  - event: manual
  # Nightly. The cron job is NOT defined here but created in the Woodpecker
  # UI under Repo -> Settings -> Crons; `cron:` filters on its NAME. So a cron
  # named `nightly` must exist, otherwise this branch never runs.
  # See docs/ci/WOODPECKER_SETUP.md, section 3 (wiring a repository
  # eingerichtet werden muss".
  - event: cron
    cron: nightly

# FULL CLONE WITH TAGS. Woodpecker's default clone is shallow; `git describe --tags`
# in init_versions (tui-build-logic.sh) would then find no tag and report 0.0.0.
# For Build & Test that is merely cosmetic, for deploy.yml it would be fatal — the clone
# is deliberately configured identically in every file, so that nobody relies on
# "the other workflow already getting it right".
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0
      tags: true

services:
  # Woodpecker attaches service containers to the workflow's network; they are reachable
  # under their NAME as hostname (here: `postgres`), on the regular port 5432.
  #
  # THIS IS THE POINT WHERE WOODPECKER HAS IT EASIER THAN GITHUB ACTIONS: the
  # GitHub pipeline starts Postgres by hand via `docker run --network host` and needs
  # a per-project reserved port for it (root: 5441, deploy job 5541). Falling back to
  # 5434 is expressly forbidden there, because the UGREEN photo app occupies that port
  # permanently. Here the whole port allocation simply disappears: every workflow has
  # its own network, two concurrent runs cannot collide on a port, and
  # the container vanishes with the run.
  #
  # THROWAWAY TEST DATABASE — not a secret (card 812). It exists only for the duration
  # of this run, is unreachable from outside and holds no real data.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: plaintext_root
      POSTGRES_USER: plaintext
      POSTGRES_PASSWORD: plaintext

steps:
  build-und-test:
    image: maven:3.9-eclipse-temurin-25
    # NO Docker socket. plaintext-app needs one because it has Testcontainers tests in
    # its normal Surefire run — plaintext-root does NOT have those, and deliberately
    # so: card 451 (Daniel's decision of 02.08.2026) replaced Testcontainers here
    # with io.zonky.test:embedded-postgres, PRECISELY to get rid of the
    # /var/run/docker.sock mounted as root. Recounted on 30.08.2026:
    # `grep -ril testcontainers` only hits comments in the two poms, the
    # class comment of EmbeddedPg and .github/workflows/playwright.yaml — not a
    # single Java class imports the library. Whoever ever adds a socket mount here
    # reverts that card.
    environment:
      # The agent mounts the Maven cache globally as a volume (woodpecker-m2 -> /root/.m2),
      # hence no separate mount here. The build cache of the maven-build-cache-extension
      # lives inside it under ~/.m2/build-cache and therefore survives the run.
      #
      # THESE THREE LINES ARE NOT OPTIONAL IN ROOT. EmbeddedPg (plaintext-root-webapp,
      # src/test) only starts an embedded server of its own when
      # SPRING_DATASOURCE_URL IS MISSING — and `initdb` refuses to run as root
      # (measured 02.08.2026, PR #22). The step container runs as root. Without these
      # variables every single one of the roughly ten test classes that use EmbeddedPg
      # falls over (RepositoryTest, MultiTenancyTest, SecurityTest, FlywayMigrationTest,
      # SchlankerKontextTest, ...), with a message about initdb that looks like an
      # environment problem of the agent and is none.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/plaintext_root
      SPRING_DATASOURCE_USERNAME: plaintext
      SPRING_DATASOURCE_PASSWORD: plaintext
      # Resource guardrail, taken over word for word from the GitHub pipeline. The NAS box
      # has 6 cores / 62 GB; without a cap every JVM sizes its heap by HOST RAM
      # (MaxRAMPercentage 25 % of 62 GB), and does so per Maven JVM AND per Surefire fork.
      # JAVA_TOOL_OPTIONS is — unlike MAVEN_OPTS — inherited by the forks as well.
      # In root this weighs more heavily than in the apps: 24 modules, and plaintext-root-webapp
      # has TWO Surefire executions (the second, `kontext-ohne-abwaehlbare-module`,
      # starts a Spring context of its own against the same database).
      MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAM=4g -XX:ActiveProcessorCount=2"
    commands:
      - . .woodpecker/waechter.sh

      # Wait until Postgres listens. Woodpecker starts services and steps AT THE SAME TIME
      # and knows no `--health-cmd` gate; without this loop the run falls over two minutes
      # later in the tests with a PSQLException, and that looks like a test failure.
      # `bash -c` instead of the step shell: the image is Ubuntu-based and has bash, the
      # step shell is /bin/sh (dash) and does not know /dev/tcp. psql would be the other
      # option, but costs an apt-get per run.
      - >-
        bash -c 'for i in $(seq 1 60); do
          (echo > /dev/tcp/postgres/5432) 2>/dev/null && { echo "postgres bereit nach $i Versuchen"; exit 0; };
          sleep 2;
        done;
        echo "FEHLER: Service-Container postgres nach 120 s nicht erreichbar." >&2;
        echo "  Erwartet: Hostname postgres, Port 5432, im Netz dieses Workflows." >&2;
        echo "  Wenn der Name nicht aufloest, hat der Agent kein Workflow-Netz gebaut" >&2;
        echo "  (WOODPECKER_BACKEND_DOCKER_NETWORK / Agent-Konfiguration pruefen)." >&2;
        exit 1'

      # Word for word the ci job of the GitHub pipeline, including the case distinction at
      # the quality gate guard:
      #   * scheduled runs (here: cron)  -> the guard RUNS ALONG and colours a
      #     red gate state visibly red. Until 29.08.2026 it was excluded everywhere,
      #     so a red gate was visible in NO CI run at all.
      #   * PR and manual runs -> excluded, so that a hotfix gets through despite a red
      #     gate. The guard reads the static weekly state, not the PR code.
      # -DskipITs: integration tests need a running app resp. Playwright browsers.
      #
      # TWO GATES THAT ARE ARMED HERE AND NOT IN THE CONSUMERS:
      #   1. JaCoCo. root sets <jacoco.halt-on-failure>true</jacoco.halt-on-failure> with
      #      <jacoco.coverage.minimum>0.40</jacoco.coverage.minimum> (status report
      #      29.08.2026, measure 13); app/guild/iot/schuetu inherit the execution and
      #      switch it off. A module below 40 % therefore turns this step RED — that
      #      is the whole point of it and not a pipeline error. Whoever wants to "repair"
      #      it does not flip the switch but grades <jacoco.coverage.minimum> in the
      #      affected module (with a rationale and a date, never 0).
      #   2. The shared arch rules from plaintext-root-archtests — root ships them
      #      itself and is thus its own first consumer.
      #
      # DO NOT TOUCH: no `-Dspring-boot.repackage.*`, no switching off of the
      # exec classifier, and no `-Droot.dual.publish=false`. The dual publish lives in
      # .mvn/maven.config and applies to both CI engines; here in the install run it costs
      # nothing, because the deploy phase is never reached at all.
      - >-
        if [ "$CI_PIPELINE_EVENT" = "cron" ]; then
          echo "Cron-Lauf: Quality-Gate-Waechter laeuft MIT.";
          mvn clean install -B -DskipITs;
        else
          echo "Ereignis $CI_PIPELINE_EVENT: Quality-Gate-Waechter ausgeschlossen.";
          mvn clean install -B -DskipITs -DexcludedGroups=quality-gate;
        fi

  coverage-uebersicht:
    image: maven:3.9-eclipse-temurin-25
    # `status: [success, failure]` = the counterpart of `if: always()`. The coverage figures
    # are interesting precisely after a red run — and in root a red run is
    # more often than not exactly a JaCoCo gate violation, whose module is visible here.
    when:
      - status: [success, failure]
    commands:
      - . .woodpecker/waechter.sh
      - mvn jacoco:report -B || echo "jacoco:report fehlgeschlagen — Uebersicht bleibt leer."
      # Woodpecker has no $GITHUB_STEP_SUMMARY. The table therefore goes into the step log;
      # that is the honest substitute, not an equivalent feature (see docs/CI.md,
      # "Was Woodpecker nicht kann").
      - >-
        bash -c 'echo "── Code Coverage — plaintext-root (Gate: 40 %, scharf) ──";
        find . -path "*/target/site/jacoco/jacoco.csv" | while read -r r; do
          m=$(echo "$r" | sed "s|./\(.*\)/target/.*|\1|");
          missed=$(tail -n +2 "$r" | awk -F, "{s+=\$4} END {print s+0}");
          covered=$(tail -n +2 "$r" | awk -F, "{s+=\$5} END {print s+0}");
          total=$((missed + covered));
          [ "$total" -gt 0 ] && printf "  %-40s %3d%% (%d/%d)\n" "$m" $((covered * 100 / total)) "$covered" "$total";
        done'

  testbericht:
    image: maven:3.9-eclipse-temurin-25
    # `status: [success, failure]`, same as the step above. The report matters MORE after a
    # red run than after a green one — that is exactly when you want to know WHICH test
    # fails, and today that only exists as a .txt excerpt in the log (which lies about
    # @Nested classes, see allure-bericht.sh). Without this line the report would be missing
    # precisely in the failure case.
    when:
      - status: [success, failure]
    # OWN STEP, NOT OWN WORKFLOW. The steps of one workflow run sequentially in the same
    # agent slot; a second workflow would occupy one of the four slots on the single agent
    # for twenty seconds of work.
    #
    # THE MOUNT IS EXPLICIT AND ONLY HERE. The obvious route would be a second line in
    # WOODPECKER_BACKEND_DOCKER_VOLUMES on the agent (today: woodpecker-m2:/root/.m2) — but
    # that hangs the volume into EVERY step of EVERY repo, which is exactly the construction
    # card 313 files as security-critical. Instead the pattern from
    # plaintext-guild/.woodpecker/analyse.yml (NVD cache): `trusted.volumes` on the repo
    # (already set for plaintext-root, checked 31.08.2026 via GET /api/repos/6) and then one
    # mount per step.
    #
    # The volume belongs to the stack plaintext-dockercompose/tri/plaintext-reports; an nginx
    # there serves it read-only on http://192.168.1.224:1155/.
    volumes:
      - woodpecker-reports:/reports
    environment:
      # Must match the ports: entry of the plaintext-reports stack. It lives here and not
      # only in the script so that the address is visible at ONE place in this repo; the
      # script carries the same value merely as a fallback.
      # Karte 1043: Der Link zeigt auf die oeffentliche Adresse, nicht mehr auf die interne
      # 192.168.1.224:1155 — seit Karte 1037 gibt es reports.plaintext.ch hinter dem
      # Keycloak-Gate, und ein Link, der nur im LAN traegt, ist in einer PR-Checkliste wertlos.
      REPORT_BASE_URL: "https://reports.plaintext.ch"
      # Runs kept per repo (proposal from card 1018, open question 2). Measured on
      # pipeline 52: one root report is 24.9 MB, so 30 runs are about 750 MB. /volume1 had
      # 4.9 TB free on 31.08.2026 — the limit exists so the directory does not grow without
      # end, not because the space is tight.
      REPORT_KEEP: "30"
      # Karte 1043: Damit allure-bericht.sh die Zeile "Testbericht (Allure)" samt Link in die
      # Check-Liste des Pull Requests schreiben kann. Ohne diesen Wert schweigt das Skript und
      # sagt das im Log — der Bericht selbst entsteht trotzdem.
      #
      # DAS SECRET MUSS AM REPO EXISTIEREN, BEVOR DIESE ZEILEN HIER STEHEN. Verweist ein
      # `from_secret` auf ein fehlendes Secret, startet Woodpecker die Pipeline GAR NICHT und
      # meldet das auch nicht an GitHub: kein Lauf, keine Zeile, keine Fehlermeldung — der PR
      # sieht aus, als waere die CI nie angestossen worden (gemessen am 02.09.2026, drei PRs
      # ueber 20 Minuten stumm). Deshalb kamen diese vier Zeilen erst jetzt nach.
      #
      # Der Token ist ein eigener PAT des Kontos Plaintext-User mit AUSSCHLIESSLICH `repo:status`
      # (Vault-Item github.woodpecker-status) — bewusst nicht der github.claude-review-pat mit
      # vollem repo-Scope. Sein Secret traegt zusaetzlich das Ereignis `pull_request`, anders als
      # die uebrigen Secrets dieses Repos: ohne das fehlte es in genau dem Lauf, fuer den es da
      # ist. Der Preis ist benannt und tragbar — wer eine .woodpecker-Datei in einem PR aendern
      # darf, koennte den Wert ausgeben lassen, und er kann nichts ausser Commit-Status schreiben.
      GITHUB_STATUS_TOKEN:
        from_secret: github_status_token
    commands:
      - . .woodpecker/waechter.sh
      - sh .woodpecker/allure-bericht.sh
