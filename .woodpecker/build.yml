# ═══════════════════════════════════════════════════════════════════════════════
#  Woodpecker-Workflow 1 von 3: BUILD & TEST
#
#  Entspricht dem Job `ci` ("Build & Test") aus
#  Plaintext-Gmbh/plaintext-scripts/.github/workflows/ci-cd-pipeline.yaml.
#
#  Laeuft NUR, wenn `.ci-engine` im Repo-Root das Wort `woodpecker` enthaelt —
#  siehe .woodpecker/waechter.sh und docs/CI-UMSCHALTEN.md.
#
#  DREI Workflows, nicht vier wie in iot/app/guild/schuetu: `verify-dev.yml` und
#  `verify-prod.yml` gibt es hier bewusst nicht. Begruendung in docs/CI-UMSCHALTEN.md,
#  Abschnitt "Was root anders macht" — kurz: root faehrt `release-only`, und die
#  GitHub-Pipeline ueberspringt genau dafuer beide Verify-Jobs
#  (`inputs.deploy-target != 'release-only'` bzw. `== 'release-all'`).
# ═══════════════════════════════════════════════════════════════════════════════

when:
  # KEIN `push` auf master. Das ist Absicht und die Entsprechung von M1 ("build once"):
  # auf master baut der DEPLOY-Workflow (deploy.yml), und der fuehrt die Unit-Tests
  # ueber MVN_TEST_FLAG=-DskipITs selbst mit. In der GitHub-Pipeline steht dafuer
  # `if: inputs.deploy-target == 'ci-only' || inputs.sonar-enabled` am ci-Job — auf
  # einem release-only-Lauf ist er uebersprungen. Wer hier `push: master` ergaenzt,
  # baut jeden Merge zweimal und belegt bei WOODPECKER_MAX_WORKFLOWS=2 die halbe
  # Kapazitaet des einzigen Agenten mit Doppelarbeit.
  - event: pull_request
  # `manual` = der "Run pipeline"-Knopf im Woodpecker-UI. Ohne diesen Eintrag
  # verwirft Woodpecker den Lauf mit "filtered out all steps" (am 30.08.2026 im
  # schuetu-Probelauf so passiert).
  - event: manual
  # Nightly. Der Cron-Job wird NICHT hier definiert, sondern in der Woodpecker-
  # Oberflaeche unter Repo -> Settings -> Crons angelegt; `cron:` filtert auf seinen
  # NAMEN. Es muss also ein Cron namens `nightly` existieren, sonst laeuft dieser
  # Zweig nie. Siehe docs/CI-UMSCHALTEN.md, Abschnitt "Was in Woodpecker
  # eingerichtet werden muss".
  - event: cron
    cron: nightly

# VOLLER KLON MIT TAGS. Der Standard-Klon von Woodpecker ist flach; `git describe --tags`
# in init_versions (tui-build-logic.sh) faende dann keinen Tag und meldete 0.0.0.
# Fuer Build & Test ist das nur kosmetisch, fuer deploy.yml waere es fatal — der Klon
# ist in allen Dateien bewusst gleich konfiguriert, damit sich niemand darauf
# verlaesst, dass "der andere Workflow es schon richtig macht".
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0
      tags: true

services:
  # Woodpecker haengt Service-Container an das Netz des Workflows; sie sind unter
  # ihrem NAMEN als Hostname erreichbar (hier: `postgres`), auf dem regulaeren Port 5432.
  #
  # DAS IST DER PUNKT, AN DEM WOODPECKER ES EINFACHER HAT ALS GITHUB ACTIONS: die
  # GitHub-Pipeline startet Postgres von Hand per `docker run --network host` und braucht
  # dafuer einen je Projekt reservierten Port (root: 5441, Deploy-Job 5541). Auf 5434
  # zurueckzustellen ist dort ausdruecklich verboten, weil die UGREEN-Photo-App den Port
  # dauerhaft belegt. Hier faellt die ganze Portvergabe ersatzlos weg: jeder Workflow hat
  # sein eigenes Netz, zwei gleichzeitige Laeufe koennen sich nicht am Port treffen, und
  # der Container verschwindet mit dem Lauf.
  #
  # WEGWERF-TESTDATENBANK — kein Geheimnis (Karte 812). Sie existiert nur fuer die Dauer
  # dieses Laufs, ist von aussen nicht erreichbar und traegt keine echten Daten.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: plaintext_root
      POSTGRES_USER: plaintext
      POSTGRES_PASSWORD: plaintext

steps:
  build-und-test:
    image: maven:3.9-eclipse-temurin-25
    # KEIN Docker-Socket. plaintext-app braucht ihn, weil dort Testcontainers-Tests im
    # normalen Surefire-Lauf stehen — in plaintext-root gibt es die NICHT, und zwar
    # absichtlich nicht: Karte 451 (Entscheidung Daniels vom 02.08.2026) hat
    # Testcontainers hier durch io.zonky.test:embedded-postgres ersetzt, GENAU um den
    # als root gemounteten /var/run/docker.sock loszuwerden. Nachgezaehlt am 30.08.2026:
    # `grep -ril testcontainers` trifft nur noch Kommentare in den beiden poms, den
    # Klassenkommentar von EmbeddedPg und .github/workflows/playwright.yaml — keine
    # einzige Java-Klasse importiert die Bibliothek. Wer hier je einen Socket-Mount
    # ergaenzt, macht die Karte rueckgaengig.
    environment:
      # Den Maven-Cache haengt der Agent global als Volume ein (woodpecker-m2 -> /root/.m2),
      # deshalb hier kein eigener Mount. Der Build-Cache der maven-build-cache-extension
      # liegt darin unter ~/.m2/build-cache und ueberlebt damit den Lauf.
      #
      # DIESE DREI ZEILEN SIND IN ROOT NICHT OPTIONAL. EmbeddedPg (plaintext-root-webapp,
      # src/test) startet nur DANN einen eigenen eingebetteten Server, wenn
      # SPRING_DATASOURCE_URL FEHLT — und `initdb` verweigert den Dienst als root
      # (gemessen 02.08.2026, PR #22). Der Step-Container laeuft als root. Ohne diese
      # Variablen faellt also jede der rund zehn Testklassen um, die EmbeddedPg nutzen
      # (RepositoryTest, MultiTenancyTest, SecurityTest, FlywayMigrationTest,
      # SchlankerKontextTest, ...), mit einer Meldung ueber initdb, die wie ein
      # Umgebungsproblem des Agenten aussieht und keines ist.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/plaintext_root
      SPRING_DATASOURCE_USERNAME: plaintext
      SPRING_DATASOURCE_PASSWORD: plaintext
      # Ressourcen-Leitplanke, wortgleich aus der GitHub-Pipeline uebernommen. Die NAS-Box
      # hat 6 Kerne / 62 GB; ohne Cap dimensioniert jede JVM ihren Heap nach HOST-RAM
      # (MaxRAMPercentage 25 % von 62 GB), und zwar pro Maven-JVM UND pro Surefire-Fork.
      # JAVA_TOOL_OPTIONS wird — anders als MAVEN_OPTS — auch von den Forks geerbt.
      # In root wiegt das schwerer als in den Apps: 24 Module, und plaintext-root-webapp
      # hat ZWEI Surefire-Ausfuehrungen (die zweite, `kontext-ohne-abwaehlbare-module`,
      # startet einen eigenen Spring-Kontext gegen dieselbe Datenbank).
      MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAM=4g -XX:ActiveProcessorCount=2"
    commands:
      - . .woodpecker/waechter.sh

      # Warten, bis Postgres horcht. Woodpecker startet Services und Steps GLEICHZEITIG und
      # kennt kein `--health-cmd`-Gate; ohne diese Schleife faellt der Lauf zwei Minuten
      # spaeter in den Tests mit einer PSQLException um, und die sieht aus wie ein Testfehler.
      # `bash -c` statt der Step-Shell: das Image ist Ubuntu-basiert und hat bash, die
      # Step-Shell ist /bin/sh (dash) und kennt /dev/tcp nicht. psql waere die andere
      # Moeglichkeit, kostet aber ein apt-get je Lauf.
      - >-
        bash -c 'for i in $(seq 1 60); do
          (echo > /dev/tcp/postgres/5432) 2>/dev/null && { echo "postgres bereit nach $i Versuchen"; exit 0; };
          sleep 2;
        done;
        echo "FEHLER: Service-Container postgres nach 120 s nicht erreichbar." >&2;
        echo "  Erwartet: Hostname postgres, Port 5432, im Netz dieses Workflows." >&2;
        echo "  Wenn der Name nicht aufloest, hat der Agent kein Workflow-Netz gebaut" >&2;
        echo "  (WOODPECKER_BACKEND_DOCKER_NETWORK / Agent-Konfiguration pruefen)." >&2;
        exit 1'

      # Wortgleich zum ci-Job der GitHub-Pipeline, inklusive der Fallunterscheidung am
      # Quality-Gate-Waechter:
      #   * planmaessige Laeufe (hier: cron)  -> der Waechter LAEUFT MIT und faerbt einen
      #     roten Gate-Stand sichtbar rot. Bis zum 29.08.2026 war er ueberall ausgeschlossen,
      #     ein rotes Gate war damit in KEINEM CI-Lauf sichtbar.
      #   * PR- und manuelle Laeufe -> ausgeschlossen, damit ein Hotfix trotz rotem Gate
      #     durchgeht. Der Waechter liest den statischen Wochenstand, nicht den PR-Code.
      # -DskipITs: Integrationstests brauchen eine laufende App bzw. Playwright-Browser.
      #
      # ZWEI GATES, DIE HIER SCHARF SIND UND IN DEN CONSUMERN NICHT:
      #   1. JaCoCo. root setzt <jacoco.halt-on-failure>true</jacoco.halt-on-failure> bei
      #      <jacoco.coverage.minimum>0.40</jacoco.coverage.minimum> (Zustandsbericht
      #      29.08.2026, Massnahme 13); app/guild/iot/schuetu erben die Ausfuehrung und
      #      schalten sie ab. Ein Modul unter 40 % laesst diesen Step also ROT werden — das
      #      ist der Sinn der Sache und kein Pipeline-Fehler. Wer es "reparieren" will,
      #      hebt nicht den Schalter, sondern staffelt <jacoco.coverage.minimum> im
      #      betroffenen Modul (mit Begruendung und Datum, nie 0).
      #   2. Die geteilten Arch-Regeln aus plaintext-root-archtests — root liefert sie
      #      selbst mit und ist damit sein eigener erster Konsument.
      #
      # NICHT ANFASSEN: kein `-Dspring-boot.repackage.*`, kein Ausschalten des
      # exec-Classifiers, und kein `-Droot.dual.publish=false`. Der Dual-Publish steht in
      # .mvn/maven.config und gilt fuer beide CI-Motoren; hier im install-Lauf kostet er
      # nichts, weil die deploy-Phase gar nicht erreicht wird.
      - >-
        if [ "$CI_PIPELINE_EVENT" = "cron" ]; then
          echo "Cron-Lauf: Quality-Gate-Waechter laeuft MIT.";
          mvn clean install -B -DskipITs;
        else
          echo "Ereignis $CI_PIPELINE_EVENT: Quality-Gate-Waechter ausgeschlossen.";
          mvn clean install -B -DskipITs -DexcludedGroups=quality-gate;
        fi

  coverage-uebersicht:
    image: maven:3.9-eclipse-temurin-25
    # `status: [success, failure]` = das Gegenstueck zu `if: always()`. Die Coverage-Zahlen
    # sind gerade nach einem roten Lauf interessant — und in root ist ein roter Lauf
    # ueberdurchschnittlich oft genau ein JaCoCo-Gate-Verstoss, dessen Modul man hier sieht.
    when:
      - status: [success, failure]
    commands:
      - . .woodpecker/waechter.sh
      - mvn jacoco:report -B || echo "jacoco:report fehlgeschlagen — Uebersicht bleibt leer."
      # Woodpecker kennt kein $GITHUB_STEP_SUMMARY. Die Tabelle geht deshalb ins Step-Log;
      # das ist der ehrliche Ersatz, keine gleichwertige Funktion (siehe docs/CI-UMSCHALTEN.md,
      # "Was Woodpecker nicht kann").
      - >-
        bash -c 'echo "── Code Coverage — plaintext-root (Gate: 40 %, scharf) ──";
        find . -path "*/target/site/jacoco/jacoco.csv" | while read -r r; do
          m=$(echo "$r" | sed "s|./\(.*\)/target/.*|\1|");
          missed=$(tail -n +2 "$r" | awk -F, "{s+=\$4} END {print s+0}");
          covered=$(tail -n +2 "$r" | awk -F, "{s+=\$5} END {print s+0}");
          total=$((missed + covered));
          [ "$total" -gt 0 ] && printf "  %-40s %3d%% (%d/%d)\n" "$m" $((covered * 100 / total)) "$covered" "$total";
        done'
